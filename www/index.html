rdente (CD 20, [STORDITO] +1 round aggiuntivo). Usa la Saggezza al posto del Carisma per calcolare PF, TS Tempra e capacità basate su Cos."},{"nome":"Flagello del saggio","tipo":"Sop","testo":"Ogni colpo che ferisce il bersaglio attiva (TS Tempra CD 18 nega): il bersaglio subisce 1d4 danni a Saggezza e 1d4 punti Ki vengono assorbiti (se il bersaglio ne possiede). Per ogni punto Ki assorbito, il kurobozu si cura di 5 PF. CD = 10 + 6 (½×12) + 4 (Sag +4) − 2."}],"ca":23,"contatto":21,"impreparato":17,"pf":78,"dv":12,"ts":{"Tempra":7,"Riflessi":9,"Volontà":10},"velocita":"15 m","attacchi":["Raffica di colpi +13/+13/+8 (1d8+5 + Flagello del saggio Tempra CD 18)"],"att_speciali":"","car":{"For":21,"Des":18,"Cos":null,"Int":7,"Sag":18,"Car":12},"bmc":"BMC +11, DMC 34 (+38 vs Sbil.)","talenti":"Arma focalizzata (colpo senz'armi), Attacco poderoso, Colpo senz'armi migliorato, Critico migliorato (colpo senz'armi), Pugno stordente migliorato","abilita":"Acrobazia +15, Furtività +11, Percezione +12, Scalare +13"},{"id":"tetro_mietitore","nome":"Tetro mietitore","livello":13,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Una falce vivente che vola radente al suolo come il vento prima della tempesta. La sua presenza lascia una scia di gelo nell'aria, e chi tenta di sbarrargli il passo non sopravvive abbastanza per raccontarlo.","extra":["Capacità difensive: semicorporeo","Aura: Aura innaturale (9 m, CD 17)"],"capacita":[{"nome":"Semicorporeo","tipo":"Sfo","testo":"Il tetro mietitore è parzialmente presente nel Piano Etereo. Subisce 50% danni dai normali attacchi fisici. Gli attacchi magici lo colpiscono normalmente."},{"nome":"Aura innaturale","tipo":"Sfo","testo":"Come Vukodlak, animali entro 9 m vengono allontanati. CD 17 = 10 + 5 + 2 (Car +2)."},{"nome":"Falce del terrore","tipo":"Sfo","testo":"La falce del tetro mietitore torna integra in 1 minuto se distrutta o perduta. Non può essere disarmato."},{"nome":"Risucchio di energia","tipo":"Sop","testo":"Ogni colpo della falce infligge 1 livello negativo alla creatura vivente colpita. Con un colpo critico, i livelli negativi inflitti sono 2. Questa capacità non funziona sui non morti."}],"ca":21,"contatto":16,"impreparato":13,"pf":75,"dv":10,"ts":{"Tempra":4,"Riflessi":5,"Volontà":9},"velocita":"Volare 18 m (perfetta), altezza max 1 m","attacchi":["Falce del terrore +10 (1d8/×3 + Risucchio di energia)"],"att_speciali":"","car":{"For":null,"Des":16,"Cos":null,"Int":7,"Sag":16,"Car":15},"bmc":"BMC +6, DMC 21","talenti":"Attacco in volo, Combattere alla cieca, Critico migliorato (falce), Mobilità","abilita":"Furtività +13, Percezione +16"},{"id":"cavaliere_senza_testa","nome":"Cavaliere senza testa","livello":13,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"in sella: spazio 3 m, portata 3 m","iniziativa":2,"descr":"Un cavaliere decapitato su cavalcatura fantasma, armato di una spada che congela il sangue. La sua sentenza di morte pende come una condanna su chiunque osi sfidarlo, e il suo galoppo notturno è un presagio funesto.","extra":["RI 18","Sensi: Vista cieca 18 m","Spazio 1,5 m (3 m in sella)"],"capacita":[{"nome":"Cavalcatura fantomatica","tipo":"Sop","testo":"Come azione veloce, il cavaliere può far apparire o scomparire la propria cavalcatura spettrale. Sulla cavalcatura aumenta il suo spazio a 3 m e la sua velocità a 15 m. La cavalcatura condivide i suoi PF."},{"nome":"Presenza terrificante","tipo":"Sop","testo":"Ogni creatura entro 9 m deve superare un TS su Volontà con CD 20 o essere [SCOSSA] per 1 minuto. Le creature con 4 DV o meno diventano invece [IN PREDA AL PANICO]. Effetto [paura, influenza mentale]."},{"nome":"Sentenza di morte","tipo":"Sop","testo":"1/giorno, gittata 18 m: il bersaglio deve superare un TS su Tempra con CD 22 (CD 24 se il cavaliere conosce il suo nome completo) o essere [BARCOLLANTE] per 1d3+1 round. Inoltre, tutti i critici contro quel bersaglio vengono confermati automaticamente per le successive 24 ore o finché il cavaliere è distrutto."}],"ca":24,"contatto":12,"impreparato":21,"pf":85,"dv":13,"ts":{"Tempra":7,"Riflessi":5,"Volontà":12},"velocita":"6 m (15 m sulla cavalcatura)","attacchi":["Spada lunga +1 Affilata Gelida +14/+9 (1d8+6 / 17-20 + 1d6 freddo)","Aura: Presenza terrificante (9 m, CD 20)"],"att_speciali":"Sentenza di morte CD 22/24","car":{"For":20,"Des":14,"Cos":null,"Int":7,"Sag":16,"Car":18},"bmc":"BMC +12, DMC 28","talenti":"Attacco in sella, Combattere in sella, Critico focalizzato (+4 conferma), Maestria intimorente, Spezzare le difese, Travolgere","abilita":"Cavalcare +18, Percezione +16"},{"id":"mohrg","nome":"Mohrg","livello":13,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Un mostro grottesco di ossa e visceri, capace di afferrare e stritolare con forza sovraumana. La sua lingua raschiante frastorna chi tocca, rendendolo più facile da ghermire e da uccidere.","extra":[],"capacita":[{"nome":"Frastornamento","tipo":"Sop","testo":"Ogni creatura toccata dalla lingua del mohrg deve superare un TS su Tempra con CD 20 o essere [FRASTORNATA] per 1 round. CD = 10 + 6 (½×13) + 2 (Car +2) + 2 (Cap. focalizzata)."}],"ca":23,"contatto":16,"impreparato":19,"pf":98,"dv":13,"ts":{"Tempra":6,"Riflessi":10,"Volontà":9},"velocita":"9 m","attacchi":["2 Schianti +15 (2d8+5 + Afferrare) e Lingua +10 a contatto (Frastornamento Tempra CD 20)"],"att_speciali":"","car":{"For":21,"Des":19,"Cos":null,"Int":7,"Sag":10,"Car":14},"bmc":"BMC +15 (+21 Lottare), DMC 30","talenti":"Attacco rapido, Capacità focalizzata (Frastornamento), Critico migliorato (schianto), Lottare migliorato, Mobilità, Robustezza","abilita":"Furtività +21, Percezione +13"},{"id":"sanguigno","nome":"Sanguigno","livello":14,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Uno spirito che esiste per versare sangue, rinchiuso in una bottiglia rituale. Vede attraverso chiunque abbia sangue nelle vene e succhia forza vitale ad ogni tocco. Finché la bottiglia è integra, torna sempre.","extra":["Capacità difensive: semicorporeo, +4 vs scacciare/positiva","Sensi: Visione del vero parziale","Debolezze: Legato alla bottiglia"],"capacita":[{"nome":"Semicorporeo","tipo":"Sfo","testo":"Come Tetro mietitore: 50% danni da attacchi fisici normali."},{"nome":"Visione del vero parziale","tipo":"Sop","testo":"Il sanguigno gode degli effetti di Visione del vero (LI 14°), ma solo nei confronti di creature dotate di sangue (umanoidi, mammiferi, rettili, mostri viventi). Contro costrutti, non morti, elementali, melme e piante, non funziona."},{"nome":"Legato alla bottiglia","tipo":"Sfo","testo":"Il sanguigno è ancorato a una bottiglia rituale creata con il necrarca. Si cura di 5 PF/ora quando è all'interno della bottiglia. La bottiglia ha CA 11, Durezza 1, PF 1. Se distrutta, il sanguigno si trasforma immediatamente in polvere. Chiunque raccolga la bottiglia può portarla con sé."},{"nome":"Intento omicida","tipo":"Sop","testo":"Come azione immediata, il sanguigno può effettuare una prova di Intimidire per demoralizzare chiunque si avvicini entro 9 m. Chi supera il tiro è immune per 24 ore."}],"ca":23,"contatto":20,"impreparato":15,"pf":72,"dv":11,"ts":{"Tempra":8,"Riflessi":7,"Volontà":13},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Tocco incorporeo +12 (6d8 + Sanguinamento 1d4)"],"att_speciali":"","car":{"For":null,"Des":18,"Cos":null,"Int":7,"Sag":14,"Car":20},"bmc":"BMC +11, DMC 26","talenti":"Attacco in volo, Combattere alla cieca, Critico migliorato (tocco), Mobilità, Volontà di ferro","abilita":"Furtività +18, Intimidire +16, Percezione +16"},{"id":"guecubu","nome":"Guecubu","livello":14,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"sottotipo terra","iniziativa":4,"descr":"Un signore della terra e del fango, capace di manipolare il terreno per intrappolare i nemici. La sua maledizione sottrae precisione e fortuna a chiunque riesca a colpirlo.","extra":["Immunità: Elettricità","Resistenze: Freddo 10","Sensi: Percezione tellurica 18 m","Aura: Terreno impervio (3 m)"],"capacita":[{"nome":"","tipo":"","testo":"Capacità magiche (LI 8°, Concentrazione +13):"},{"nome":"","tipo":"","testo":"3/giorno — Ammorbidire terra e pietra. 1/giorno — Fango rallentante (Rifl CD 19), Trasmutare fango in roccia (CD 20), Trasmutare roccia in fango (CD 20)."},{"nome":"Terreno impervio","tipo":"Sop","testo":"L'area entro 3 m dal guecubu è considerata terreno difficile. Non si applica contro creature che hanno effetti di libertà di movimento o si trovano in aria. Effetto [terra]. Può essere soppresso da Consacra o Cerchio magico contro il male (LI ≥ 8°)."},{"nome":"Sfortuna","tipo":"Sop","testo":"Ogni creatura colpita deve superare un TS su Volontà con CD 20 o subire −2 ai tiri per colpire, ai TS e alle prove di abilità per 1 minuto, e tutti i critici contro di essa vengono confermati automaticamente. Effetto [maledizione]. CD = 10 + 7 (½×14) + 5 (Car +5) − 2."}],"ca":23,"contatto":16,"impreparato":17,"pf":105,"dv":14,"ts":{"Tempra":8,"Riflessi":7,"Volontà":11},"velocita":"9 m, Scavare 3 m","attacchi":["Morso +14 (1d8+6 + Sfortuna) e 2 Schianti +14 (1d6+6 + Sfortuna)"],"att_speciali":"","car":{"For":22,"Des":18,"Cos":null,"Int":7,"Sag":18,"Car":21},"bmc":"BMC +14, DMC 29","talenti":"Attacco rapido, Attacco turbinante, Critico focalizzato (morso), Critico migliorato (morso), Mobilità, Riflessi in combattimento, Robustezza","abilita":"Percezione +18, Scalare +10"},{"id":"baykok","nome":"Baykok","livello":15,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":6,"descr":"Un arciere scheletrico la cui mira non conosce errori e le cui frecce portano morte e stordimento. Quando urla, anche i più coraggiosi si coprono le orecchie — e quando uccide, si nutre dell'anima della vittima.","extra":[],"capacita":[{"nome":"Arco d'osso","tipo":"Sfo","testo":"L'arco del baykok torna integro in 1 minuto se distrutto. Le frecce si generano automaticamente (illimitate) e contano come +1. La prima freccia che colpisce ogni round obbliga il bersaglio a superare un TS su Tempra con CD 19 o essere [BARCOLLANTE] per 1 round. CD = 10 + 7 + 2 (Car +2)."},{"nome":"Stordimento","tipo":"Sop","testo":"Come indicato nell'Arco d'osso, su ogni colpo con la prima freccia del round."},{"nome":"Divorare anima","tipo":"Sop","testo":"1/giorno, come azione standard: se una creatura entro 9 m è [MORENTE], il baykok la divora spiritualmente (muore immediatamente). Il baykok si cura di 5d6+10 PF e ottiene gli effetti di Velocità per 4 round."},{"nome":"Ululato terrificante","tipo":"Sop","testo":"1/giorno, come azione standard: tutte le creature entro 9 m devono superare un TS su Volontà con CD 19 o essere [STORDITE] per 1 round (chi supera: [SCOSSA] per 1 round). Effetto [uditivo, paura, influenza mentale]."}],"ca":22,"contatto":19,"impreparato":19,"pf":113,"dv":15,"ts":{"Tempra":7,"Riflessi":11,"Volontà":9},"velocita":"9 m","attacchi":["2 Martelli +14 (1d6+3)","Distanza: Arco d'osso +20/+15/+10 (1d8+4 / 19-20/×3 + 1d6 energia negativa + Stordimento CD 19)"],"att_speciali":"Divorare anima, Ululato terrificante CD 19","car":{"For":17,"Des":22,"Cos":null,"Int":7,"Sag":10,"Car":15},"bmc":"BMC +14, DMC 31","talenti":"Critico migliorato (arco lungo composito), Tirare in movimento, Tiro preciso, Tiro rapido, Tiro ravvicinato","abilita":"Percezione +18, Furtività +24"},{"id":"spettro_dei_tumuli","nome":"Spettro dei tumuli","livello":15,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Un guerriero non morto che non può essere distrutto definitivamente. Armato di una spada maledetta e di un'armatura forgiata negli inferi, ritorna sempre dalla sua tomba per imporre la propria volontà.","extra":["RD 5/argento","RI 21","Immunità: Freddo","Resistenze: Elettricità 10, Fuoco 10","Capacità difensive: Immortalità degli spettri"],"capacita":[{"nome":"","tipo":"","testo":"Capacità magiche (LI 15°, Concentrazione +19):"},{"nome":"","tipo":"","testo":"5/giorno — Raggio di indebolimento (Vol CD 16). 3/giorno — Scagliare maledizione* (Vol CD 18)."},{"nome":"Immortalità degli spettri","tipo":"Sfo","testo":"Quando lo spettro viene ridotto a 0 PF, il suo teschio sopravvive e può essere raccolto come parte focale. Dopo 1d3+1 giorni si rianima automaticamente. Per distruggerlo permanentemente: versare acqua santa sui resti."},{"nome":"Equipaggiamento maledetto","tipo":"Sfo","testo":"La spada infernale e l'armatura dello spettro si ricompongono automaticamente in 1 minuto se distrutte o perse."}],"ca":24,"contatto":14,"impreparato":20,"pf":113,"dv":15,"ts":{"Tempra":9,"Riflessi":9,"Volontà":11},"velocita":"9 m","attacchi":["Spada infernale +1 +20/+15/+10 (1d10+8 / 17-20)"],"att_speciali":"","car":{"For":25,"Des":18,"Cos":null,"Int":7,"Sag":15,"Car":18},"bmc":"BMC +18, DMC 33","talenti":"Attacco poderoso, Attacco rapido, Critico migliorato (spada infernale), Incalzare, Incalzare migliorato, Mobilità","abilita":"Percezione +17, Intimidire +14"},{"id":"sciame_di_teschi_schioccanti","nome":"Sciame di teschi schioccanti","livello":16,"tipo":"Disarticolato","taglia":"sciame di minuscoli","sciame":true,"focus":false,"nota":"","iniziativa":3,"descr":"Centinaia di teschi animati che volano in formazione compatta, schioccando mascelle e urlando in coro. Chi si trova in mezzo a loro è assalito su tutti i fronti — e se li uccidi tutti in un colpo, esplodono.","extra":["Resistenze: Acido 10","Capacità difensive: tratti degli sciami","Spazio 3 m"],"capacita":[{"nome":"Tratti degli sciami","tipo":"Sfo","testo":"Immune a qualsiasi danno da arma singola. Subisce danno dimezzato da armi taglienti e perforanti, danno normale da armi contundenti e +50% da effetti ad area. Immune a [FRASTORNAMENTO] e manovre di combattimento. Occupa uno spazio di 3 m × 3 m."},{"nome":"Distrazione","tipo":"Sop","testo":"Ogni creatura nel proprio spazio alla fine del turno: TS Tempra CD 21 o [NAUSEATA] per 1 round."},{"nome":"Esplosione d'ossa","tipo":"Sop","testo":"Se lo sciame viene ridotto a 0 PF da un attacco nemico, esplode in un raggio di 9 m infliggendo 8d8 danni (metà perforanti, metà da energia negativa). TS Riflessi CD 21 dimezza."},{"nome":"Battere i denti","tipo":"Sop","testo":"Come azione gratuita: tutte le creature entro 6 m, TS Volontà CD 21 o [CONFUSE] per 1 round. Effetto [uditivo, influenza mentale, compulsione]."},{"nome":"Urlo spaventoso","tipo":"Sop","testo":"1/1d4 round, azione gratuita: tutte le creature entro 9 m, TS Volontà CD 21 o [SCOSSE] per 1d4 round. Effetto [uditivo, paura, influenza mentale]."}],"ca":23,"contatto":17,"impreparato":21,"pf":105,"dv":14,"ts":{"Tempra":11,"Riflessi":10,"Volontà":12},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Sciame 3d6"],"att_speciali":"Distrazione CD 21, Esplosione d'ossa CD 21, Battere i denti CD 21, Urlo spaventoso CD 21","car":{"For":5,"Des":16,"Cos":null,"Int":5,"Sag":13,"Car":19},"bmc":"BMC —, DMC —","talenti":"Mobilità, Riflessi fulminei, Robustezza, Tempra possente, Volontà di ferro"},{"id":"bestia_mummificata","nome":"Bestia mummificata","livello":16,"tipo":"Zombie","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":1,"descr":"Una bestia imbalsamata e riportata alla vita, rapida come il vento e forte come un muro. Sente l'invisibile, vola verso il bersaglio in uno scatto improvviso e lascia solo polvere dove c'era carne.","extra":["Debolezze: Vulnerabilità al Fuoco","Sensi: Vedere invisibilità","Aure: Telepatia (18 m), Presenza terrificante (9 m, CD 20)","Spazio 3 m, Portata 1,5 m"],"capacita":[{"nome":"Telepatia","tipo":"Sfo","testo":"Comunicazione telepatica bidirezionale con il necrarca entro 18 m, senza necessità di linguaggio comune."},{"nome":"Presenza terrificante","tipo":"Sop","testo":"Come Cavaliere senza testa ma CD 20. TS Vol CD 20 o [SCOSSA] 1 min (4 DV o meno: [IN PREDA AL PANICO])."},{"nome":"Tempesta di fauci","tipo":"Sfo","testo":"Se la bestia mummificata è in lotta, può effettuare un attacco di morso aggiuntivo a +19 (3d6+8) come azione gratuita ogni round."},{"nome":"Balzare","tipo":"Sfo","testo":"Al termine di una carica, la bestia può effettuare un attacco completo invece di un singolo attacco."},{"nome":"Colpo di polvere","tipo":"Sfo","testo":"Ogni creatura vivente uccisa dalla bestia mummificata si disintegra in cenere. I cadaveri così distrutti non possono essere rianimati con altri metodi."},{"nome":"Esplosione di velocità","tipo":"Sop","testo":"2/giorno, come azione veloce: la bestia ottiene gli effetti di Velocità per 1 round (atk extra, velocità raddoppiata). Non può effettuare cariche nello stesso round."}],"ca":26,"contatto":12,"impreparato":26,"pf":120,"dv":16,"ts":{"Tempra":12,"Riflessi":9,"Volontà":10},"velocita":"12 m","attacchi":["2 Artigli +19 (3d6+8 / 19-20 + Tempesta di fauci)"],"att_speciali":"Balzare, Colpo di polvere, Esplosione di velocità (2/g)","car":{"For":26,"Des":13,"Cos":null,"Int":7,"Sag":19,"Car":19},"bmc":"BMC +21, DMC 32 (+36 vs Sbil.)","talenti":"Allerta, Attacco poderoso, Attacco rapido, Combattere alla cieca, Critico focalizzato (artiglio), Critico migliorato (artiglio), Riflessi in combattimento","abilita":"Furtività +16, Percezione +23, Scalare +20"},{"id":"scheletro_magus","nome":"Scheletro magus","livello":16,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":5,"descr":"Uno scheletro caster di raro potere. Scaglia sei dardi di energia negativa per round, destabilizza ogni tentativo magico nemico e si protegge con uno scudo arcano quasi impenetrabile.","extra":["RD 5/magia","RI 21","+4 vs scacciare/positiva","Aura: Instabilità arcana (9 m)","Capacità difensive: Scudo superiore"],"capacita":[{"nome":"Instabilità arcana","tipo":"Sop","testo":"Ogni caster nemico entro 9 m che tenti di lanciare un incantesimo deve farlo in difensiva (Concentrazione CD 15 + livello inca à con CD 24 o essere [FRASTORNATA] per 1d3 round. Se la creatura è protetta da effetti anti-paura, questi vengono prima dissolti come da Dissolvi magie superiore (LI 14°). CD = 10 + 8 + 4 (Car +4) + 2."},{"nome":"Grido","tipo":"Sop","testo":"1/ora, azione di round completo: emette un grido devastante che forma un cono di 9 m. Ogni creatura nell'area deve superare un TS su Tempra CD 23 o subire 14d10 danni. Udibile a 100 m. Effetto [uditivo, morte]. I non morti sono immuni all'effetto [morte] ma subiscono comunque i danni. Se la sidhe subisce danni mentre grida: TS Volontà CD 15+danno o cessa e diventa [FRASTORNATA] per 1 round. Penetra il silenzio fino al 3° livello."}],"ca":30,"contatto":28,"impreparato":16,"pf":128,"dv":17,"ts":{"Tempra":10,"Riflessi":19,"Volontà":20},"velocita":"Volare 15 m (perfetta)","attacchi":["Tocco della sidhe +26 a contatto (14d6 energia negativa + Terrore Vol CD 24)"],"att_speciali":"Grido CD 23 (1/ora)","car":{"For":null,"Des":32,"Cos":null,"Int":10,"Sag":20,"Car":19},"bmc":"BMC +25, DMC 40","talenti":"Allerta, Critico migliorato (tocco), Inseguire, Mobilità, Posizione velata, Riflessi in combattimento, Volontà di ferro","abilita":"Furtività +26, Percezione +25"},{"id":"dracolich","nome":"Dracolich","livello":20,"tipo":"Scheletro","taglia":"enorme","sciame":false,"focus":false,"nota":"non può volare, balza fino a 18 m","iniziativa":0,"descr":"Un drago trasformato in non morto: la stazza di un palazzo, il potere di un esercito. Le sue ossa portano ancora la furia elementale della sua specie, e nessuna creatura vivente può sostenere a lungo la sua presenza. È il coronamento definitivo di ogni necrarca al massimo livello.","extra":["Sensi: Percezione cieca 18 m","RD 5/−","RI 25","Immunità: elemento scelto in vita","Vulnerabilità: elemento opposto","Aure: Vapori elementali (1,5 m, 1d6 elemento), Presenza terrificante (9 m, Vol CD 24)","Spazio 6 m, Portata 3 m (4,5 m coda)"],"capacita":[{"nome":"","tipo":"","testo":"Capacità magiche (LI 17°, const FORME = [{"id":"scheletro_corazzato","nome":"Scheletro corazzato","cat":"I","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +0, Des +0 — Velocità: 9 m — CA naturale: +4","taglia":"Media","sciame":false,"descr":"Le lastre di ferro che un tempo proteggevano un soldato si sono fuse alle sue ossa come una seconda pelle. Non cammina: avanza, con la lentezza inesorabile di qualcosa che non conosce stanchezza né dolore. Le frecce rimbalzano sul suo petto come pioggia su una roccia; le lame scivolano via con un grido metallico. Ciò che lo ha ucciso una volta non riuscirà a farlo una seconda volta.","note":[],"for":0,"des":0,"velocita":"9 m","ca_tipo":"naturale","ca":4,"campi":{"Attacchi":"2 artigli 1d4","Sensi":"Scurovisione 18 m"},"extra":[],"rd":"8/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"scheletro_di_lupo","nome":"Scheletro di lupo","cat":"I","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +0, Des +4 — Velocità: 15 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"Il cranio è ancora quello di un lupo, con i canini gialli intatti e le orbite vuote che ardono di luce spettrale. Corre senza fare rumore — le zampe d'osso sul terreno non producono il calpestio della carne — e il naso d'ossa odora ancora il sangue caldo da centinaia di metri. Arriva prima che lo si senta.","note":[],"for":0,"des":4,"velocita":"15 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"morso 1d6 + Atterramento gratuito su morso (manovra di forma, sez. 4.14)","Sensi":"Scurovisione 18 m, Olfatto","Bonus abilità":"+4 Percezione, +2 Sopravvivenza"},"extra":[],"rd":"5/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"scheletro_insanguinato","nome":"Scheletro insanguinato","cat":"I","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +0 — Velocità: 9 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"Le ossa sono ancora bagnate, coperte di un sangue che non si asciuga mai: una maledizione che lega l'anima alla carne disfatta. Ogni colpo lo spacca, ogni colpo lo riforma. È morto molte volte, e ogni volta si è rialzato con la stessa determinazione cieca — finché la luce del sole non lo trova.","note":[],"for":2,"des":0,"velocita":"9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"2 artigli 1d4","Sensi":"Scurovisione 18 m","Qualità":"Cura rapida 2 (sospesa finché esposto alla luce solare diretta); si rialza automaticamente una volta da 0 PF con 1 PF rimasto (una sola volta per trasformazione)."},"extra":[],"rd":"5/contundenti","vuln":"luce solare diretta (1d4 danni necrotici per round, Cura rapida sospesa)","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_putrescente","nome":"Zombie putrescente","cat":"I","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +2, Des −2 — Velocità: 6 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"La carne si slaccia dalle ossa in strisce morbide, e l'odore che emana è qualcosa tra il dolce e il marcio, qualcosa che si insinua nelle narici e non vuole più andarsene. Cammina piano, con l'indifferenza di chi non sa più cosa significhi avere fretta. Chi gli si avvicina troppo scopre che l'aria attorno a lui è già un'arma.","note":[],"for":2,"des":-2,"velocita":"6 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"schianto 1d6","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Aura di putrefazione (raggio 3 m): chi inizia il proprio turno nell'aura deve superare un TS Tempra o subisce −2 ai Tiri per Colpire e alle prove di abilità basate sui sensi per 1 round. Il Carnaio è immune. Effetto [veleno]."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_balzante","nome":"Zombie balzante","cat":"I","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +0, Des +4 — Velocità: 12 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"Non ha la pesantezza dei suoi simili: i muscoli corrotti si sono indurati in qualcosa di simile a cartilagine tesa, e ogni suo passo è un agguato in potenza. Si lancia con una velocità oscena, percorre distanze impossibili in un solo balzo, e quando ha finito di uccidere è già altrove. L'unica cosa prevedibile di lui è che non si fermerà.","note":[],"for":0,"des":4,"velocita":"12 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"schianto 1d6","Sensi":"Scurovisione 18 m","Qualità":"NON Barcollante; Balzo prodigioso (1/incontro, az. di movimento): si sposta fino a 9 m in qualsiasi direzione senza provocare AdO; Scatto (1/incontro, az. di movimento): si muove fino a 2× la propria velocità.","Bonus abilità":"+8 Acrobazia"},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_della_peste","nome":"Zombie della peste","cat":"I","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +2, Des −2 — Velocità: 9 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"La pancia è gonfia e preme contro la pelle come un otre pieno d'acqua stagnante; dentro, qualcosa si muove. Cammina con la dignità malata di chi non sa più distinguere tra sé e la malattia che lo abita. Abbatterlo non è la fine: è l'inizio di qualcos'altro, umido e ronzante.","note":[],"for":2,"des":-2,"velocita":"9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"schianto 1d6 + Tocco di peste (TS Tempra o Affaticato 1d4 round)","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Esplosione di vermi — si attiva (a) a 0 PF, (b) al cambio forma, (c) al ritorno alla forma originale: nube di vermi in raggio 3 m, 1d6 danni ogni 2 livelli del Carnaio (massimo 10d6), TS Riflessi dimezza; TS Tempra o Nauseato 1 round. Il Carnaio è immune."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"ghoul","nome":"Ghoul","cat":"I","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +2 — Velocità: 9 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"I denti sono troppo lunghi per la bocca, e la bocca troppo larga per il viso. Si muove piegato, col peso del corpo portato in avanti come se stesse sempre per cadere — eppure è sempre sul punto di saltare. L'odore che emana è quello dei cimiteri dopo la pioggia, e le sue unghie lasciano solchi nei muri di pietra.","note":[],"for":2,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"morso 1d6 + 2 artigli 1d6; ogni colpo a segno costringe il bersaglio a superare un TS Tempra o essere Paralizzato 1d4+1 round. Le creature elfiche sono immuni.","Sensi":"Scurovisione 18 m","Bonus abilità":"+2 Furtività, +2 Acrobazia"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"lacedon","nome":"Lacedon","cat":"I","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +2 — Velocità: 9 m + nuoto 12 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"Nell'acqua si muove con una grazia che sulla terra non ha mai avuto: il corpo gonfio dal sale scivola tra le correnti come se ci fosse nato, e nell'oscurità del fondale i suoi occhi non vedono meno di quanto vedano alla luce. Sale dalle acque senza che il rumore dell'acqua lo preceda. Sulla riva o sotto, mangia allo stesso modo.","note":[],"for":2,"des":2,"velocita":"9 m + nuoto 12 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"morso 1d6 (Paralizzato come il Ghoul; elfi immuni) + 2 artigli 1d6 (nessuna paralisi)","Sensi":"Scurovisione 18 m, visione subacquea","Qualità":"Anfibio (il Carnaio può respirare in aria e sott'acqua e non subisce penalità alle manovre subacquee)","Bonus abilità":"+8 Nuotare"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"mano_strisciante","nome":"Mano strisciante","cat":"I","tipo":"Disarticolato","taglia_raw":"Minuscola","combattente":false,"stat":"For −2, Des +4 — Velocità: 6 m + scalata 6 m — CA naturale: +0 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":false,"descr":"Cinque dita, nessun polso, e una volontà che non dovrebbe esistere. Striscia sulle nocche come un ragno con troppe poche zampe, e la sua unica ossessione è quella di stringere — qualcosa, qualsiasi cosa. Preferisce i colli degli incantatori: capisce, a modo suo, dove risiede il potere.","note":["Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola: +2 TxC, +2 CA, +4 Furtività e Volare, −3 BCM/DMC."],"for":-2,"des":4,"velocita":"6 m + scalata 6 m","ca_tipo":"naturale","ca":0,"campi":{"Attacchi":"artiglio 1d2 + Aggrappare migliorato (manovra di forma, sez. 4.14, non provoca AdO). Se il collo di un incantatore viene afferrato, il bersaglio non può pronunciare componenti verbali ed è considerato In Lotta.","Sensi":"Vista cieca 9 m","Bonus abilità":"+8 Furtività (totale +12 con taglia Minuscola), +4 Scalare"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"artiglio","dado":"1d2","contatto":false,"des":false,"secondario":false}]},{"id":"cranio_rotolante","nome":"Cranio rotolante","cat":"I","tipo":"Disarticolato","taglia_raw":"Minuscola","combattente":false,"stat":"For −4, Des +4 — Velocità: 6 m — CA naturale: +1 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":false,"descr":"Si è staccato dal resto tanto tempo fa, e non ha mai smesso di rotolare. Urla con una voce che esce da denti ancora serrati, un suono cavo che rimbalza tra le pareti dei dungeon come un'eco che non trova pace. Piccolo, veloce, quasi impossibile da ignorare.","note":["Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola: +2 TxC, +2 CA, +4 Furtività e Volare, −3 BCM/DMC."],"for":-4,"des":4,"velocita":"6 m","ca_tipo":"naturale","ca":1,"campi":{"Attacchi":"morso 1d3 + Ululato cavernoso (1/incontro, az. standard, raggio 9 m): TS Volontà o Scosso 1d4 round; un bersaglio già Scosso diventa invece Spaventato 1 round. Effetto [paura, sonoro].","Sensi":"Scurovisione 18 m","Bonus abilità":"+4 Intimidire, +4 Furtività"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"1d3","contatto":false,"des":false,"secondario":false}]},{"id":"scheletro_elementale","nome":"Scheletro elementale","cat":"II","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +0 — Velocità: 9 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"Non si capisce di che elemento sia finché non apre la bocca — o finché l'aria attorno a lui non inizia a bruciare, congelare, o crepitare. Ha fatto la sua scelta nel momento della prima trasformazione, e l'ha scritta nelle ossa: una firma che nessun vivo avrebbe potuto lasciare. Chi si avvicina troppo lo impara sulla propria pelle.","note":["Elemento scelto all'attivazione: Fuoco, Freddo, Acido o Elettricità. Coppie di vulnerabilità: Fuoco↔Freddo, Acido↔Elettricità."],"for":2,"des":0,"velocita":"9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"2 artigli 1d4 + 1d6 danni del tipo scelto","Sensi":"Scurovisione 18 m","Qualità":"Aura elementale (raggio 3 m): ogni round, chi si trova nell'aura subisce danni del tipo scelto; TS Riflessi dimezza. Scala: 1d6 al 6° livello, +1d6 ogni 2 livelli (8°: 2d6, 10°: 3d6 … 20°: 8d6). Anche gli alleati del Carnaio sono soggetti. Resistenza 10 al tipo scelto."},"extra":[],"rd":"5/contundenti","vuln":"+50% al tipo opposto al scelto","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"scheletro_condottiero","nome":"Scheletro condottiero","cat":"II","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +0 — Velocità: 9 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"Si muove con la stessa autorità che aveva in vita: la colonna vertebrale dritta, il passo preciso, lo sguardo che raduna. I non morti attorno a lui si assestano come soldati udendo un ordine silenzioso. Non è il più letale del campo di battaglia — ma sotto il suo comando, gli altri lo diventano.","note":[],"for":2,"des":0,"velocita":"9 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"2 artigli 1d4 (o arma a 1 mano se umanoide armato)","Sensi":"Scurovisione 18 m","Qualità":"Aura tattica (raggio 9 m): i non morti evocati dal Necrarca nell'aura ottengono +1 TxC e +1 danno al 6° livello, +1 ogni 3 livelli oltre il 6° (9°: +2, 12°: +3, 15°: +4, 18°: +5, 20°: +5). Cumulativo con i bonus delle Doti Dominio. Coordinamento tattico: i non morti evocati nell'aura possono riposizionarsi di 1,5 m come azione gratuita senza provocare AdO."},"extra":[],"rd":"5/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false},{"n":1,"nome":"arma impugnata","dado":"arma","arma":true,"nota":"arma a 1 mano se umanoide armato)"}]},{"id":"zombie_corruttore","nome":"Zombie corruttore","cat":"II","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +2, Des −2 — Velocità: 6 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"La sua carne emana un tepore sbagliato, quasi quello di un corpo ancora vivo — ma il sangue che perde non coagula mai, e chi riceve un suo colpo trova che le ferite faticano a chiudersi. Non è il veleno che uccide: è la profanazione silenziosa, la certezza che nessuna cura potrà raggiungerti davvero.","note":[],"for":2,"des":-2,"velocita":"6 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"schianto 1d6 + Tocco corruttivo (TS Volontà o le cure ricevute dal bersaglio sono dimezzate per 1d4 round)","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Aura profanata (raggio 3 m): gli incantesimi con descrittore [bene] e le versioni Cura Ferite subiscono un LI effettivo ridotto di 1. Il Carnaio è immune."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_del_muschio_giallo","nome":"Zombie del muschio giallo","cat":"II","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +0, Des +0 — Velocità: 6 m — CA naturale: +1","taglia":"Media","sciame":false,"descr":"L'odore è dolce, insolito per qualcosa di così morto. Le spore invisibili si depositano sulle superfici, si insinuano nei polmoni di chi respira troppo vicino, e il pensiero comincia a rallentare come cera scaldata al sole. Vuole che tu rimanga. Non importa se sei sveglio o no.","note":[],"for":0,"des":0,"velocita":"6 m","ca_tipo":"naturale","ca":1,"campi":{"Attacchi":"schianto 1d4 + Spore di charme (TS Volontà o Affascinato 1d4 round)","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Aura muschio (raggio 1,5 m): TS Volontà o Scosso 1 round; Vapore soporifero (1/incontro, az. standard, raggio 3 m): TS Volontà o Addormentato 1d4 round (svegliato da attacchi → Affaticato 1 round)."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"ghast","nome":"Ghast","cat":"II","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +2 — Velocità: 9 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"La puzza arriva prima di lui, e quando arriva il tuo stomaco ha già capito cosa sta per succedere. Si muove con la certezza di chi sa che il paralizzante è già nell'aria, già nei polmoni di chi lo circonda. Mangia con calma, senza fretta, come se la preda non potesse andare da nessuna parte — e spesso ha ragione.","note":[],"for":2,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"morso 1d6 + Paralisi (TS Tempra o Paralizzato 1d4+1 round; elfi NON immuni) + 2 artigli 1d6 (nessuna paralisi)","Sensi":"Scurovisione 18 m","Qualità":"Aura fetore (raggio 3 m): TS Tempra o Nauseato 1 round. Chi supera il TS è immune all'aura per 24 ore.","Bonus abilità":"+2 Furtività, +2 Acrobazia"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"festrog","nome":"Festrog","cat":"II","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +4, Des +2 — Velocità: 12 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"Si muove a quattro zampe come se la posizione eretta fosse solo un lontano ricordo. La corsa è silenziosa e scattante, e cambia direzione senza preavviso. Non insegue: intercetta. L'odore del sangue fresco lo porta dove deve andare, e il tocco delle sue dita lascia la febbre.","note":[],"for":4,"des":2,"velocita":"12 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"morso 1d6 + 2 artigli 1d4 + Tocco infetto (TS Tempra o Affaticato 1d4 round)","Sensi":"Scurovisione 18 m, Vista in penombra, Olfatto","Qualità":"Scatto e morso (1/round): si muove fino a 2× velocità e compie un attacco di morso come parte dello stesso movimento; Quadrupede (+4 alle prove per resistere a Sbilanciare e Spingere).","Bonus abilità":"+4 Percezione, +2 Acrobazia"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"ombra","nome":"Ombra","cat":"II","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −4, Des +4 — Velocità: volo 12 m (max 1 m — sez. 4.6) — Deviazione: +2","taglia":"Media","sciame":false,"descr":"Non ha una forma precisa: si estende lungo le superfici come un'ombra proiettata da una luce che non c'è, e si addensa dove vuole colpire. Il freddo che precede il suo tocco non è quello del vento: è la sensazione di qualcosa che ti attraversa e porta via un pezzo di ciò che eri.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata automatica. Bonus CA di deviazione (vale anche su CA di contatto). Volo max 1 m fino al 16° livello."],"for":-4,"des":4,"velocita":"volo 12 m (max 1 m","ca_tipo":"deviazione","ca":2,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 1d6 gelidi + Drenaggio Forza: TS Tempra o −1d4 For temporanea per 1 minuto (senza limite cumulativo; For 0 → Indifeso). Una sola applicazione per round per bersaglio.","Sensi":"Scurovisione 18 m","Qualità":"Semicorporeo; bonus alla Furtività in condizioni di penombra o oscurità.","Bonus abilità":"+8 Furtività, +4 Volare"},"extra":[],"rd":"—","vuln":"luce solare diretta (1d4 danni necrotici per round)","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"1d6","contatto":true,"des":true,"secondario":false}]},{"id":"allip","nome":"Allip","cat":"II","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −4, Des +2 — Velocità: 6 m + volo 12 m perfetto (max 1 m — sez. 4.6) — Deviazione: +2","taglia":"Media","sciame":false,"descr":"Balbetta senza sosta, con una voce troppo sottile per distinguere le parole. Chi l'ha sentita da vicino dice che i suoni sembravano quasi avere senso — sembravano rispondere alle proprie domande — ma quando ci si è alzati non si ricordava nulla. Solo la stanchezza. Solo il silenzio che non se ne andava.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata automatica. Bonus CA di deviazione (vale anche su CA di contatto). Volo max 1 m fino al 16° livello."],"for":-4,"des":2,"velocita":"6 m + volo 12 m perfetto (max 1 m","ca_tipo":"deviazione","ca":2,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 1d4 psichici + Drenaggio Saggezza: TS Volontà o −1d4 Sag temporanea per 1 minuto (senza limite cumulativo; Sag 0 → Privo di Sensi). Una sola applicazione per round per bersaglio.","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Balbettio caotico (1/incontro, az. standard, cono 9 m): TS Volontà o Confuso 1d4 round (alleati del Carnaio esclusi); Babbling difensivo (passivo): chi attacca il Carnaio in mischia ha il 50% di possibilità di dover superare un TS Volontà o perdere la propria azione."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"1d4","contatto":true,"des":true,"secondario":false}]},{"id":"sciame_di_mani_striscianti","nome":"Sciame di mani striscianti","cat":"II","tipo":"Disarticolato","taglia_raw":"Minuscola — sciame","combattente":false,"stat":"For −4, Des +4 — Velocità: 6 m + scalata 6 m — CA naturale: +0 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":true,"descr":"Decine di mani che strisciano in formazione silenziosa. Alcune sono piccole come quelle di bambini; altre sono larghe come vanghe. Ognuna si muove da sola, ma tutte si muovono insieme verso lo stesso obiettivo. Il rumore che fanno è quello delle unghie sul legno.","note":["Sciame: occupa 3 caselle, danno automatico (no TxC), immune a critici e danno di precisione. Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola applicati normalmente."],"for":-4,"des":4,"velocita":"6 m + scalata 6 m","ca_tipo":"naturale","ca":0,"campi":{"Attacchi":"danni da sciame 1d6 contundenti/perforanti automatici a ogni creatura nelle 3 caselle occupate","Sensi":"Vista cieca 9 m","Qualità":"Distrazione (TS Tempra o Nauseato 1 round); Disarmare di massa (az. gratuita 1/round, manovra di forma sez. 4.14): tutti gli oggetti nelle caselle del sciame; gli oggetti di taglia Piccola/Minuscola vengono trascinati di 3 m a fine round."},"extra":["Tratti sciame: immune a critici e danno di precisione; vulnerabile +50% ai danni da area; dimezzato da taglienti e perforanti; pieno da contundenti."],"rd":"—","vuln":"+50% danni da area","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"sciame","dado":"1d6","sciame":true}]},{"id":"fata_dente","nome":"Fata-dente","cat":"II","tipo":"Disarticolato","taglia_raw":"Minuscola","combattente":false,"stat":"For −4, Des +4 — Velocità: 3 m + volo 18 m perfetto (max 1 m — sez. 4.6) — CA naturale: +0 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":false,"descr":"È grande come un sasso e bianco come osso, con due ali membranose che sbattono senza fare rumore. Sembra quasi un insetto — finché non apre le fauci. Il dente è ancora integro, con le radici esposte e pulsanti, e quando morde strappa qualcosa che non è solo carne.","note":["Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola: +2 TxC, +2 CA, +4 Furtività e Volare, −3 BCM/DMC. Forma: grosso dente d'avorio (\\~15 cm) con ali ossee membranose e 2 denti laterali aguzzi."],"for":-4,"des":4,"velocita":"3 m + volo 18 m perfetto (max 1 m","ca_tipo":"naturale","ca":0,"campi":{"Sensi":"Scurovisione 18 m, Vista in penombra","Qualità":"Volo perfetto; Spasmo mortale — si attiva (a) a 0 PF, (b) al cambio forma, (c) al ritorno alla forma originale: polvere fatata necrotica in raggio 1,5 m, TS Tempra o Infermo 1d4 round. Effetto [veleno]. Il Carnaio è immune.","Bonus abilità":"+8 Volare, +4 Furtività, +4 Acrobazia"},"extra":["Attacco (1): morso 1d3 + Paralisi (TS Tempra o Paralizzato 1d3 round; elfi immuni)","Attacco (2): pizzico dei denti laterali (Sporco Trucco, TxC di contatto, non provoca AdO): −1 Destrezza temporanea automatica per 1 minuto, senza TS (cumulativo senza limite)","Attacco (3): estrazione dente (manovra di forma sez. 4.14, anche su bersagli svegli): −1 Carisma temporaneo per 1 minuto + Sanguinamento 1. Automatica su bersagli Indifesi o Paralizzati."],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"1d3","contatto":false,"des":false,"secondario":false}]},{"id":"cavaliere_scheletrico","nome":"Cavaliere scheletrico","cat":"III","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +4, Des +2 — Velocità: 9 m — CA naturale: +4","taglia":"Media","sciame":false,"descr":"Era un comandante prima di morire, e la morte non ha revocato quel grado. Si muove con l'autorità di chi ha guidato eserciti, e qualcosa nei ranghi dei non morti risponde ancora a quella voce silenziosa. La spada è ancora impugnata bene: solo più fredda.","note":["⚠ Il Carnaio mantiene il proprio BAB lento in questa forma. La forma combattente della Categoria IV (Mohrg) è quella con BAB pieno."],"for":4,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":4,"campi":{"Attacchi":"arma marziale impugnata + scudo (se disponibili), oppure 2 artigli 1d4","Sensi":"Scurovisione 18 m","Qualità":"Maestria spettrale: armi marziali impugnate +1 TxC e +1 danno al 9° livello (sblocco), +1 ogni 3 livelli oltre il 9° (12°: +2, 15°: +3, 18°: +4, 20°: +5); Aura di comando (raggio 9 m): tutti gli alleati del Carnaio nell'aura (PG, evocazioni, qualsiasi alleato) ottengono +1 TxC e +1 TS contro gli effetti [paura], scala come Maestria spettrale; Sentinella della tomba: +2 TS contro [paura] (auto)."},"extra":["Competenze in forma: armi marziali (tutte), armatura leggera, scudi (no torre)"],"rd":"5/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"arma impugnata","dado":"arma","arma":true,"nota":"arma marziale impugnata"},{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"scheletro_saettante","nome":"Scheletro saettante","cat":"III","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +0, Des +4 — Velocità: 9 m — CA naturale: +2","taglia":"Media","sciame":false,"descr":"Le ossa delle dita sono ancora abbastanza flessibili da tendere l'arco. Si posiziona dove non lo si aspetta — su punti alti, in angoli bui — e aspetta con la pazienza di chi non ha più fretta. Il fischio della freccia è l'unico preavviso.","note":[],"for":0,"des":4,"velocita":"9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"arco/balestra impugnata (se disponibile), oppure Schegge ossee (attacco a distanza naturale, raggio 18 m, 1d6 perforanti, TxC = BAB + Des)","Sensi":"Scurovisione 18 m","Qualità":"Multitiro osseo (azione completa): spara 2 schegge ossee nello stesso round contro lo stesso bersaglio o bersagli diversi; Ricarica scheletrica: genera 1d4 nuove schegge per round automaticamente (nessuna munizione necessaria); Mira nelle ombre: +2 TxC a distanza in condizioni di penombra o oscurità."},"extra":["Competenze in forma: armi semplici e marziali a distanza (arco corto, arco lungo, balestra leggera, dardi, ascia da lancio)"],"rd":"5/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"arma impugnata","dado":"arma","arma":true,"nota":"arco/balestra impugnata (se disponibile)"}]},{"id":"zombie_vermivoro","nome":"Zombie vermivoro","cat":"III","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +4, Des −2 — Velocità: 6 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"La carne si muove dall'interno. Non si vede nulla finché non si è già stati colpiti, e allora si sente: un formicolio freddo sotto la pelle, qualcosa che scava lentamente verso il cuore. Non è il dolore il problema. È sapere cosa sta succedendo.","note":[],"for":4,"des":-2,"velocita":"6 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"schianto 1d8 + Parassita (TS Tempra o −1 Costituzione temporanea per 1 minuto; senza limite cumulativo; Cos 0 → Morto)","Sensi":"Scurovisione 18 m, Olfatto","Qualità":"Barcollante; Carne brulicante (passivo): chi colpisce il Carnaio in mischia con armi naturali o senz'arma deve superare un TS Riflessi o un parassita salta sull'attaccante (−1 Cos temporanea per 1 minuto); Espulsione di parassiti (1/incontro, az. standard, raggio 3 m): TS Riflessi o Nauseato 1 round + −1 Cos automatico."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d8","contatto":false,"des":false,"secondario":false}]},{"id":"signore_della_peste_zombie","nome":"Signore della peste Zombie","cat":"III","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +2, Des −2 — Velocità: 9 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"Cammina avvolto in un alone di cenere e vapore che non si dissipa mai. Chi gli si avvicina non vede con chiarezza; chi colpisce da lontano rischia di mancare. E quando finisce, l'esplosione che segue ricorda a tutti che non era ancora finita.","note":[],"for":2,"des":-2,"velocita":"9 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"schianto 1d6 + Tocco di peste avanzato (TS Tempra o Esausto immediato 1d4 round; un bersaglio già Esausto subisce invece −2 Cos per 1 minuto, senza limite)","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Nebbia di cenere (aura, raggio 3 m): 20% miss chance bidirezionale — chi è nell'aura ha il 20% di mancare i propri attacchi, E chi è fuori ha il 20% di mancare i bersagli nell'aura. ⚠ Vale anche per gli alleati del Carnaio nell'aura; Esplosione di peste (si attiva a 0 PF / cambio forma / ritorno): nube 4,5 m, 1d6 necrotici ogni 2 livelli (max 10d6), TS Riflessi dimezza; TS Tempra o Affaticato 1d4 round. Il Carnaio è immune."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"ghul","nome":"Ghul","cat":"III","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +4, Des +2 — Velocità: 9 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"Ha l'aspetto di un demone di basso rango: la pelle troppo scura per qualcosa di vivo, le articolazioni che flettono nel verso sbagliato. Sputa energia necromantica come un cobra e paralizza come un ghoul, e poi ti guarda negli occhi con una voce troppo ragionevole per il contesto.","note":[],"for":4,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":3,"campi":{"Sensi":"Scurovisione 18 m, Vista in penombra","Bonus abilità":"+4 Furtività, +4 Acrobazia"},"extra":["Attacchi melee: morso 1d6 + 2 artigli 1d6; ogni colpo a segno obbliga il bersaglio a superare un TS Tempra o essere Paralizzato 1d4+1 round (elfi NON immuni — origine demonica)","Sputo necromantico (1/round, az. standard, raggio 9 m, TxC di contatto): 2d6 danni necrotici che curano i non morti adiacenti al bersaglio della stessa quantità; TS Tempra o −2 Costituzione temporanea per 1 minuto (cumulativo senza limite).","Capacità magiche (LI = livello del Carnaio, CD sez. 4.9): 3/giorno Suggestione."],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"spettro","nome":"Spettro","cat":"III","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −2, Des +6 — Velocità: volo 18 m perfetto (max 1 m — sez. 4.6) — Deviazione: +3","taglia":"Media","sciame":false,"descr":"Non ha peso, non ha suono, non ha presenza — finché non decide di averla. Il freddo che porta con sé non è quello dell'inverno: è il freddo di qualcosa che ti svuota dall'interno, una sottrazione lenta che non si ferma finché non hai smesso di muoverti.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata automatica. Bonus CA di deviazione (vale anche su CA di contatto). Volo max 1 m fino al 16° livello."],"for":-2,"des":6,"velocita":"volo 18 m perfetto (max 1 m","ca_tipo":"deviazione","ca":3,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 1d6 necrotici + Drenaggio Costituzione: TS Tempra o −1d4 Cos temporanea per 1 minuto (senza limite cumulativo; Cos 0 → Morto). Una sola applicazione per round per bersaglio.","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Coperta di tenebre: in condizioni di penombra o oscurità i nemici che tentano di colpire il Carnaio hanno un 20% di miss chance aggiuntivo.","Bonus abilità":"+8 Furtività, +8 Volare"},"extra":[],"rd":"—","vuln":"luce solare diretta (1d6 danni necrotici per round)","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"1d6","contatto":true,"des":true,"secondario":false}]},{"id":"banshee_minore","nome":"Banshee minore","cat":"III","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −4, Des +4 — Velocità: volo 12 m perfetto (max 1 m — sez. 4.6) — Deviazione: +3","taglia":"Media","sciame":false,"descr":"Il lamento arriva prima della forma: un suono lungo e sottile che sale e scende senza logica, che rimbalza tra le pareti e sembra provenire da ogni direzione. Quando la si vede, è già troppo vicina — e quando urla, è già troppo tardi.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata automatica. Bonus CA di deviazione. Volo max 1 m fino al 16° livello. Il tocco cura gli altri non morti adiacenti, mai il Carnaio (ruolo esclusivo del Sanguigno, Categoria IV)."],"for":-4,"des":4,"velocita":"volo 12 m perfetto (max 1 m","ca_tipo":"deviazione","ca":3,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 4d6 energia negativa — danneggia i viventi; cura gli altri non morti adiacenti della stessa quantità (mai il Carnaio stesso).","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Urlo lamentoso (1/incontro, az. standard, cono 6 m): TS Tempra o Spaventato 1d4 round + 1d6 danni sonori ogni 2 livelli del Carnaio (max 10d6), TS Tempra dimezza i danni ma non la paura. Creature sorde: immuni alla paura, non ai danni. Effetto [paura, sonoro]; Pianto continuo (passivo): chi inizia il proprio turno in mischia con il Carnaio, TS Volontà o −2 TxC contro il Carnaio per quel round. Effetto [paura, mentale, sonoro]."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"4d6","contatto":true,"des":true,"secondario":false}]},{"id":"sciame_di_ossa","nome":"Sciame di ossa","cat":"III","tipo":"Disarticolato","taglia_raw":"Minuscola — sciame","combattente":false,"stat":"For −2, Des +6 — Velocità: 6 m + volo 9 m (max 1 m — sez. 4.6) — CA naturale: +0 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":true,"descr":"Non è uno sciame di insetti: il rumore è sbagliato, troppo duro, troppo secco. Centinaia di frammenti — costole spezzate, vertebre, dita disarticolate — che si muovono come un banco di pesci in cerca di carne su cui affilarsi.","note":["Sciame: occupa 3 caselle, danno automatico (no TxC), immune a critici e danno di precisione. Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. ⚠ Vulnerabilità invertite rispetto allo Sciame di mani (Categoria II)."],"for":-2,"des":6,"velocita":"6 m + volo 9 m (max 1 m","ca_tipo":"naturale","ca":0,"campi":{"Attacchi":"danni da sciame 2d6 taglienti automatici a ogni creatura nelle 3 caselle occupate + Lacerazione (TS Tempra o Sanguinamento 1d4, cumulativo; rimosso con cura magica o Guarire CD 15)","Sensi":"Vista cieca 12 m","Qualità":"Distrazione (TS Tempra o Nauseato 1 round)."},"extra":["Tratti sciame: immune a critici e danno di precisione; pieno da taglienti e perforanti; dimezzato da contundenti; vulnerabile +50% ai danni da area. ⚠ Invertito rispetto allo Sciame di mani."],"rd":"—","vuln":"+50% danni da area","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"sciame","dado":"2d6","sciame":true}]},{"id":"cuore_infranto","nome":"Cuore Infranto","cat":"III","tipo":"Disarticolato","taglia_raw":"Minuscola","combattente":false,"stat":"For +0, Des +4 — Velocità: 9 m + scalata 9 m — CA naturale: +2 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":false,"descr":"Pulsa ancora, con un ritmo che non corrisponde a nessun ritmo umano. Cammina su otto zampe di osso affilato, e il sangue che trasuda dalla sua superficie non è del tutto suo. Chi viene morso da quelle fauci porta via qualcosa di più del dolore.","note":["Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola: +2 TxC, +2 CA, +4 Furtività e Volare, −3 BCM/DMC. Forma: cuore pulsante (\\~15 cm) con 8 zampe ossee da ragno (\\~60 cm)."],"for":0,"des":4,"velocita":"9 m + scalata 9 m","ca_tipo":"naturale","ca":2,"campi":{"Attacchi":"morso 1d6 (critico 19-20) + Sanguinamento 1d6 + Maledizione del cinico (TS Volontà o Affaticata costante + nessun bonus morale per il bersaglio; rimossa con Calmare Emozioni o rimozione maledizioni). Effetto [maledizione, mentale].","Sensi":"Percezione cieca 9 m, Scurovisione 18 m","Bonus abilità":"+8 Furtività (totale +12 con taglia), +8 Scalare, +4 Intuizione"},"extra":["Fauci seghettate: su critico confermato → 1 livello negativo (TS Tempra entro 24 ore per rimuoverlo, altrimenti permanente).","Capacità magiche (LI = livello del Carnaio, CD sez. 4.9): a volontà — Aprire/Chiudere, Immagine Silenziosa, Suono Fantasma; 3/giorno — Disperazione Opprimente, Intralciare, Vuoto di Memoria."],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"scuoiato","nome":"Scuoiato","cat":"III","tipo":"Disarticolato","taglia_raw":"Piccolo","combattente":false,"stat":"For +0, Des +4 — Velocità: volo 12 m (manovrabilità media, max 1 m — sez. 4.6) — CA naturale: +1 (+1 da taglia Piccola)","taglia":"Piccola","sciame":false,"descr":"È una pelle senza corpo — o meglio, è una pelle che ha deciso di non averne più bisogno. Fluttua con una grazia morbida e silenziosa, e quando si drappeggia attorno a un cadavere ne assume la forma con una fedeltà che spaventa più dell'aspetto originale.","note":["Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Piccola: +1 TxC, +1 CA, +2 Furtività e Volare, −2 BCM/DMC. Forma: pelle umanoide vuota e fluttuante, metà superiore intatta, metà inferiore a brandelli."],"for":0,"des":4,"velocita":"volo 12 m (manovrabilità media, max 1 m","ca_tipo":"naturale","ca":1,"campi":{"Attacchi":"morso 1d4 + 2 artigli 1d4 con Afferrare (manovra di forma, sez. 4.14); bersaglio aggrappato → Immobilizzato (il Carnaio NON è In Lotta), Stritolare 1d4 automatico/round.","Qualità":"Amorfo (immune a danni di precisione e critici); Comprimersi (passa per aperture di 1/4 del proprio spazio). Sensi: Individuazione dei Non Morti permanente, Scurovisione 18 m."},"extra":["Modalità A — Forma libera:","Modalità B — Controllare Corpo (alternativa all'uso in combattimento):","Il Carnaio si avviluppa attorno a un cadavere umanoide (Medio o Piccolo, integro, morto da meno di 24 ore) e ne assume l'aspetto fisico esatto: +20 Camuffare contro chi conosceva il cadavere, +10 contro estranei. NON ottiene: linguaggi, ricordi, abilità di classe o conoscenze culturali del cadavere (Raggirare CD 15+ per reggere un'interrogazione). Mentre indossa il corpo: For 14 (o quella del cadavere se superiore), camminata invece di volo. Non può usare Afferrare/Avviluppare. Danni allo Scuoiato: metà a esso, metà al corpo ospite; danni ad area: pieni a entrambi. Corpo ospite: PF 15 (Medio) o 10 (Piccolo); se distrutto, il Carnaio emerge automaticamente. Uso primario: spionaggio e infiltrazione urbana."],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"1d4","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"cavaliere_senza_testa","nome":"Cavaliere senza testa","cat":"IV","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +4, Des +2 — Velocità: 9 m — CA naturale: +4","taglia":"Media","sciame":false,"descr":"La testa manca, eppure la postura è quella di chi sa dove sta andando. Porta ancora l'armatura di chi è morto in battaglia, e la spada non è appesa: è impugnata. Quando scaglia la propria testa avvolta in fiamme spettrali, le orbite vuote sembrano guardare il bersaglio anche in volo.","note":[],"for":4,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":4,"campi":{"Attacchi":"arma marziale impugnata (se disponibile), oppure 2 artigli 1d6","Sensi":"Scurovisione 18 m (collegamento spettrale con la testa anche quando è in volo)","Qualità":"Testa fiammeggiante (1/round, az. standard, raggio 18 m, TxC di contatto): il Carnaio scaglia la propria testa avvolta in fiamme spettrali — 1d6 danni ogni 2 livelli del Carnaio (al 12°: 6d6, al 20°: 10d6), metà fuoco e metà necrotici; esplosione 1,5 m nel punto d'impatto, TS Riflessi dimezza; la testa ritorna in mano a fine round; Carica terrificante (passivo): quando il Carnaio carica, il bersaglio TS Volontà o Scosso 1d4 round (già Scosso → Spaventato 1 round). Effetto [paura]; Mai decapitabile: immune a effetti di decapitazione e armi vorpal."},"extra":["Competenze in forma: armi marziali, armatura media, scudi"],"rd":"5/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"arma impugnata","dado":"arma","arma":true,"nota":"arma marziale impugnata (se disponibile)"},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"golem_dossa","nome":"Golem d'ossa","cat":"IV","tipo":"Scheletro","taglia_raw":"Grande","combattente":false,"stat":"For +6, Des −2 — Velocità: 9 m — CA naturale: +6","taglia":"Grande","sciame":false,"descr":"Non è un singolo scheletro: è un edificio fatto di ossa. Vertebre tenute insieme da tendini necrotici, costole che formano una gabbia vivente, braccia assemblate da dozzine di arti diversi. Si muove piano, come qualcosa che sa di non dover avere fretta. Tutto ciò che si trova nel suo percorso viene preso o rinchiuso.","note":["Taglia Grande: portata 1,5 m (aggiuntiva), BCM/DMC +2, −1 TxC e −1 CA da taglia (sez. 3.1)."],"for":6,"des":-2,"velocita":"9 m","ca_tipo":"naturale","ca":6,"campi":{"Attacchi":"2 schianti 1d8 + Presa schiacciante (manovra di forma, sez. 4.14): se entrambi gli schianti colpiscono lo stesso bersaglio nello stesso round, Lotta gratuita (no AdO) con +4; mantenendo la presa, Stritolare 2d6+For automatici all'inizio di ogni turno.","Sensi":"Scurovisione 18 m","Qualità":"Gabbia di costole (1/incontro, az. standard, manovra di forma sez. 4.14): tenta di imprigionare una creatura adiacente di taglia Media o inferiore — TS Riflessi o Immobilizzata dentro la gabbia toracica (TS Tempra ogni round per liberarsi vs DMC sez. 4.14; 1d6 perforanti automatici/round mentre è rinchiusa). Il Carnaio può muoversi portando con sé il prigioniero; Cura rapida 2; Stabilità: +4 DMC contro Sbilanciare e Spingere."},"extra":[],"rd":"12/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":2,"nome":"schianti","dado":"1d8","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_radiante_necrotico","nome":"Zombie radiante necrotico","cat":"IV","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +2, Des −2 — Velocità: 6 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"La pelle non copre: irradia. Emana un'energia che i viventi sentono come freddo profondo alle ossa, e i non morti che lo circondano invece si raddrizzano, si riparano, si nutrono. È il cuore di un campo di battaglia che funziona al contrario.","note":[],"for":2,"des":-2,"velocita":"6 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"schianto 1d6 + 1d6 energia negativa aggiuntivi","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Aura radiante necrotica (raggio 4,5 m, passiva): all'inizio di ogni turno del Carnaio, i viventi nell'aura subiscono danni da energia negativa (TS Volontà dimezza) e i non morti nell'aura (comprese le evocazioni del Necrarca) vengono curati della stessa quantità. Progressione: 2d6 al 12° (sblocco), +1d6 ogni 2 livelli oltre il 12° (14°: 3d6, 16°: 4d6, 18°: 5d6, 20°: 6d6); Pulsazione concentrata (1/incontro, az. standard): l'aura raddoppia il dado di danno/cura per 1 round."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_infestato","nome":"Zombie infestato","cat":"IV","tipo":"Zombie","taglia_raw":"Media","combattente":false,"stat":"For +4, Des −2 — Velocità: 6 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"Non è mai solo. Si muove portando con sé una colonia invisibile, e ogni ferita che riceve diventa un'apertura. Chi lo colpisce scopre presto che attaccare questo zombie è come colpire un alveare — e che l'alveare risponde.","note":[],"for":4,"des":-2,"velocita":"6 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"schianto 1d8 + Morsi degli inquilini: +1d6 danni perforanti (insetti nella ferita)","Sensi":"Scurovisione 18 m","Qualità":"Barcollante; Sciame interno (passivo): ogni volta che il Carnaio subisce danno da un attacco in mischia, l'aggressore subisce automaticamente 2d6 danni perforanti + TS Tempra o Sanguinamento 1d4 e Nauseato 1 round; Eruzione dello sciame — si attiva (a) a 0 PF, (b) al cambio forma, (c) al ritorno: uno sciame di insetti indipendente (3 caselle, 2d6 automatici, Distrazione TS Tempra o Nauseato) si materializza e attacca i nemici più vicini per 1 round ogni 4 livelli del Carnaio (al 12°: 3 round), poi si disperde."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d8","contatto":false,"des":false,"secondario":false}]},{"id":"mohrg","nome":"Mohrg","cat":"IV","tipo":"Ghoul","taglia_raw":"Media","combattente":true,"stat":"For +6, Des +4 — Velocità: 12 m — CA naturale: +4","taglia":"Media","sciame":false,"descr":"Le viscere sono ancora fuori — non perché nessuno le abbia riposte, ma perché si muovono da sole, come tentacoli che cercano qualcosa da stringere. È veloce, più veloce di quanto dovrebbe essere, e la lingua è l'arma più pericolosa che porta con sé. Non incanta: paralizza.","note":["⚔ FORMA COMBATTENTE (sez. 9.7): BAB pieno (pari al livello di classe); +1 PF/DV temporaneo addizionale (totale +4 PF/DV con bonus di categoria); capacità minori consentite (Cura rapida, mobilità). ⛔ ZERO INCANTESIMI in questa forma — eccezione unica alla sez. 4.12."],"for":6,"des":4,"velocita":"12 m","ca_tipo":"naturale","ca":4,"campi":{"BAB pieno":"pari al livello di Carnaio (al 12°: +12/+7/+2, tre attacchi; al 20°: +20/+15/+10/+5)","Attacchi":"2 schianti 1d8 + Lingua paralizzante (attacco secondario, TxC di contatto): TS Tempra o Paralizzato 1d4 round (elfi NON immuni)","Sensi":"Scurovisione 18 m","Qualità":"Cura rapida 3; Agilità cadaverica: il Carnaio può compiere un passo di 3 m (invece di 1,5 m) come azione gratuita nel proprio turno."},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":2,"nome":"schianti","dado":"1d8","contatto":false,"des":false,"secondario":false}]},{"id":"sussurrante","nome":"Sussurrante","cat":"IV","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −2, Des +6 — Velocità: volo 15 m perfetto (max 1 m fino al 16° livello) — Deviazione: +4","taglia":"Media","sciame":false,"descr":"Non parla: sussurra. Il suono è troppo basso per capire le parole, ma abbastanza alto da impedire di ignorarlo. Chi resta in ascolto troppo a lungo smette di capire cosa sta facendo e perché. Chi si avvicina abbastanza scopre che le voci sembrano rispondergli, e che la risposta è sempre la stessa: avvicinarsi ancora.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata automatica. Bonus CA di deviazione (vale anche su CA di contatto). Volo libero dal 17°."],"for":-2,"des":6,"velocita":"volo 15 m perfetto (max 1 m fino al 16° livello)","ca_tipo":"deviazione","ca":4,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 2d6 psichici + Drenaggio Saggezza: TS Volontà o −1d4 Sag temporanea per 1 minuto (senza limite cumulativo; Sag 0 → Privo di Sensi). Una sola applicazione per round per bersaglio.","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Sussurri di follia (aura passiva, raggio 6 m): i nemici che iniziano il proprio turno nell'aura devono superare un TS Volontà o subire −1 Sag temporanea (cumulativo senza limite, senza ulteriori TS). Effetto [influenza mentale, sonoro]; Comando sussurrato (1/incontro, az. standard, raggio 9 m): un bersaglio, TS Volontà o esegue un attacco completo contro un alleato a scelta del Carnaio nel proprio prossimo turno, poi è Confuso 1 round. Effetto [influenza mentale, compulsione]."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"2d6","contatto":true,"des":true,"secondario":false}]},{"id":"sanguigno","nome":"Sanguigno","cat":"IV","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −2, Des +4 — Velocità: volo 12 m perfetto (max 1 m fino al 16° livello) — Deviazione: +4","taglia":"Media","sciame":false,"descr":"Sembra quasi trasparente, come un'impronta lasciata nell'aria da qualcosa che non c'è più. Ma il tocco è reale — freddo, preciso, succhiante. Non lascia ferite visibili: lascia stanchezza, la sensazione di essere stati svuotati dall'interno. Il Carnaio invece si scalda.","note":["Tipo Spirito → Semicorporeo (sez. 4.5). Arma Accurata automatica. Bonus CA di deviazione. Ruolo esclusivo: lifesteal personale del Carnaio (la Banshee minore cura solo le evocazioni, mai il Carnaio)."],"for":-2,"des":4,"velocita":"volo 12 m perfetto (max 1 m fino al 16° livello)","ca_tipo":"deviazione","ca":4,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 4d6 danni necrotici + Assorbimento vitale: il Carnaio recupera PF pari all'intero danno inflitto. Se è già a PF pieni, i PF in eccesso diventano PF temporanei (massimo pari a 2× il livello del Carnaio; durano 1 ora; non si cumulano con altri PF temporanei oltre il limite).","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Sete di sangue: contro bersagli Sanguinanti o con meno della metà dei PF massimi, il tocco infligge +1d6 danni aggiuntivi; Scia ematica (passivo): il Carnaio percepisce automaticamente la posizione di tutte le creature Sanguinanti entro 18 m (senza TS né prove)."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"4d6","contatto":true,"des":true,"secondario":false}]},{"id":"sciame_di_teschi_schioccanti","nome":"Sciame di teschi schioccanti","cat":"IV","tipo":"Disarticolato","taglia_raw":"Minuscola — sciame","combattente":false,"stat":"For −2, Des +6 — Velocità: volo 12 m (max 1 m fino al 16° livello) — CA naturale: +1 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":true,"descr":"Decine di teschi che volano in formazione caotica, mandibole schioccanti, orbite che puntano in ogni direzione. Il rumore che fanno da soli è già insopportabile; ma è l'urlo corale, quando decidono di emetterlo tutti insieme, che rompe la volontà.","note":["Sciame: occupa 3 caselle, danno automatico (no TxC), immune a critici e danno di precisione. Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola applicati."],"for":-2,"des":6,"velocita":"volo 12 m (max 1 m fino al 16° livello)","ca_tipo":"naturale","ca":1,"campi":{"Attacchi":"danni da sciame 3d6 perforanti automatici a ogni creatura nelle 3 caselle occupate","Sensi":"Scurovisione 18 m","Qualità":"Distrazione (TS Tempra o Nauseato 1 round); Ululato corale (1/incontro, az. standard, raggio 9 m dallo sciame): decine di teschi ululano in coro — TS Volontà o Spaventato 1d4 round; un bersaglio già Scosso o Spaventato diventa invece In Preda al Panico 1 round. Effetto [paura, sonoro]; Morso concentrato (1/round, az. gratuita): lo sciame concentra i morsi su un singolo bersaglio nelle proprie caselle — quel bersaglio subisce +1d6 danni aggiuntivi e TS Tempra o Sanguinamento 1d6."},"extra":["Tratti sciame: immune a critici e danno di precisione; vulnerabile +50% ai danni da area; dimezzato da taglienti e perforanti; pieno da contundenti."],"rd":"—","vuln":"+50% danni da area","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"sciame","dado":"3d6","sciame":true}]},{"id":"cavaliere_della_tomba","nome":"Cavaliere della Tomba","cat":"V","tipo":"Scheletro","taglia_raw":"Media","combattente":true,"stat":"For +6, Des +2 — Velocità: 9 m — CA naturale: +4","taglia":"Media","sciame":false,"descr":"L'armatura non è indossata: è cresciuta. Le piastre di ferro corroso si sono fuse alle vertebre, i rivetti spuntano dalle scapole, e la visiera è cucita alla mascella. Si muove con la fluidità di chi non distingue più tra sé e il proprio equipaggiamento. L'elemento che sceglie diventa parte del combattimento: non un'aggiunta, ma un'intenzione.","note":["⚔ FORMA COMBATTENTE (sez. 9.7): BAB pieno; +1 PF/DV addizionale (totale +5 PF/DV); capacità minori consentite (Cura rapida, mobilità). ⛔ ZERO INCANTESIMI — eccezione unica alla sez. 4.12. Elemento scelto all'attivazione: Fuoco, Freddo, Acido o Elettricità."],"for":6,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":4,"campi":{"BAB pieno":"pari al livello di Carnaio (al 15°: +15/+10/+5, tre attacchi; al 20°: +20/+15/+10/+5)","Attacchi":"arma marziale impugnata + 2d6 danni del tipo scelto, oppure 2 artigli 1d6 + 2d6 del tipo scelto","Sensi":"Scurovisione 18 m","Qualità":"Esplosione della rovina (1/incontro, az. standard, cono 9 m): 1d6 danni del tipo scelto ogni 2 livelli del Carnaio (al 15°: 7d6, massimo 10d6), TS Riflessi dimezza; Cura rapida 4; Implacabile: il terreno difficile non magico non rallenta il Carnaio in questa forma."},"extra":["Armatura della tomba: armatura completa corrosa fusa nel corpo (bonus armatura +9, nessuna penalità al movimento, non rimovibile né disarmabile). Competenze: armi marziali (tutte)."],"rd":"10/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"arma impugnata","dado":"arma","arma":true,"nota":"arma marziale impugnata"},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"bestia_mummificata","nome":"Bestia mummificata","cat":"V","tipo":"Zombie","taglia_raw":"Grande","combattente":false,"stat":"For +8, Des −2 — Velocità: 9 m — CA naturale: +5","taglia":"Grande","sciame":false,"descr":"Le bende tengono insieme qualcosa che non dovrebbe più stare unito. Si muove con la pesantezza deliberata di un'architettura vivente: ogni passo è un atto di volontà tettonica. Chi la vede per la prima volta tende a fermarsi — e fermarsi, di fronte a questa cosa, è già un errore.","note":["Taglia Grande: portata 1,5 m (aggiuntiva), BCM/DMC +2, −1 TxC e −1 CA da taglia (sez. 3.1). Dadi armi naturali scalati (schianto 1d8 → 2d6 con taglia Grande, sez. 3.3)."],"for":8,"des":-2,"velocita":"9 m","ca_tipo":"naturale","ca":5,"campi":{"Attacchi":"2 schianti 2d6 + Polvere della tomba (sul colpo): TS Tempra o Indebolito (−2 Forza) per 1 minuto (versione meccanica della Peste delle Mummie, sez. 6.3)","Sensi":"Scurovisione 18 m, Olfatto","Qualità":"NON Barcollante (conserva gli istinti ferini); Disperazione (aura, raggio 9 m): la prima volta che una creatura vede il Carnaio in questa forma, deve superare un TS Volontà o essere Paralizzata dalla paura per 1d4 round (chi supera il TS o subisce l'effetto è immune per 24 ore). Effetto [paura, influenza mentale]; Travolgere (az. completa): il Carnaio si muove in linea retta fino a 2× velocità attraverso le caselle di nemici di taglia Media o inferiore — TS Riflessi o 2d6+For danni e Proni (chi supera il TS si sposta di lato)."},"extra":[],"rd":"5/— (nessun tipo la supera)","vuln":"+50% fuoco","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":2,"nome":"schianti","dado":"2d6","contatto":false,"des":false,"secondario":false}]},{"id":"baykok","nome":"Baykok","cat":"V","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +2, Des +6 — Velocità: 9 m + volo 12 m (manovrabilità buona, sez. 4.6) — CA naturale: +3","taglia":"Media","sciame":false,"descr":"Le costole sono esposte, le orbite vuote tranne per due punti di luce che si spostano lentamente. Vola senza fare rumore e si ferma lontano, e quando tende il suo arco d'osso non mira al corpo: mira a qualcosa di più profondo. Chi viene colpito da quelle frecce sente che manca qualcosa, qualcosa che non si vede sulle mappe dell'anatomia.","note":["Arco spettrale: colpisce la CA di contatto (touch AC) — le frecce attraversano armature e scudi. Volo libero dal 17° livello."],"for":2,"des":6,"velocita":"9 m + volo 12 m (manovrabilità buona, sez. 4.6)","ca_tipo":"naturale","ca":3,"campi":{"Sensi":"Scurovisione 18 m, Vista in penombra","Qualità":"Multitiro spettrale (az. completa): spara 3 frecce nello stesso round contro lo stesso bersaglio o bersagli diversi; Urlo terrificante (1/incontro, az. standard, raggio 12 m): TS Volontà o Spaventato 1d4 round (già Scosso/Spaventato → In Preda al Panico). Effetto [paura, sonoro]; Divorare il respiro (az. completa, su bersaglio adiacente Paralizzato, Indifeso o Privo di Sensi): 4d6 danni automatici + 1 livello negativo; il Carnaio guadagna PF temporanei pari ai danni inflitti (1 ora).","Bonus abilità":"+8 Furtività, +4 Percezione"},"extra":["Arco spettrale: il Carnaio materializza un arco lungo d'osso che solo lui può usare; frecce spettrali a volontà (no munizioni). Raggio 30 m. Danno 1d8 + bonus Des. Colpisce la CA di contatto (le frecce attraversano armature e scudi). Ogni freccia a segno: TS Tempra o 1 livello negativo (sez. 6.4).","Attacchi alternativi: in mischia, 2 artigli 1d4"],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":2,"nome":"artigli","dado":"1d4","contatto":false,"des":false,"secondario":false}]},{"id":"harionago","nome":"Harionago","cat":"V","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +4, Des +4 — Velocità: 9 m — CA naturale: +3","taglia":"Media","sciame":false,"descr":"I capelli — se si possono chiamare ancora così — sono lunghi fino al suolo e terminano in uncini d'osso sottili come aghi. Quando ridono per la prima volta, al suono risponde qualcosa nel petto di chi ascolta. Il sorriso dura pochissimo: poi i capelli si
