tendono e il lavoro comincia.","note":["La Presa multipla è una manovra di forma (sez. 4.14): usa BMC = livello + Cha + 4 e DMC = 10 + livello + Cha + 4. Il Carnaio NON è In Lotta mentre mantiene le prese: può castare normalmente (sez. 4.12)."],"for":4,"des":4,"velocita":"9 m","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"3 ciocche unciniate (portata 3 m ciascuna): 1d6+For con Afferrare (manovra di forma, sez. 4.14) per ciascuna","Sensi":"Scurovisione 18 m, Vista in penombra","Qualità":"Presa multipla: fino a 3 prese simultanee (una per ciocca, una per bersaglio); mantenerle non impone In Lotta al Carnaio, che ha le mani libere e casta normalmente; i bersagli si liberano contro la DMC speciale (sez. 4.14); Stritolare con gli uncini: ogni bersaglio in presa subisce 1d6+For automatici all'inizio del turno del Carnaio + TS Tempra o Sanguinamento 1d4; Risata agghiacciante (passivo, al primo attacco del combattimento): chi sente entro 9 m, TS Volontà o Scosso 1d4 round. Effetto [paura, sonoro].","Bonus abilità":"+4 Furtività, +4 Acrobazia"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":3,"nome":"ciocche unciniate","dado":"1d6+For","contatto":false,"des":false,"secondario":false}]},{"id":"devourer","nome":"Devourer","cat":"V","tipo":"Spirito","taglia_raw":"Grande","combattente":false,"stat":"For +6, Des +2 — Velocità: 9 m + volo 9 m perfetto (sez. 4.6) — Deviazione: +5","taglia":"Grande","sciame":false,"descr":"È grande e vuoto, con un torace trasparente dove le anime imprigionate si muovono in circolo come pesci in una boccia. Non mangia la carne: mangia ciò che la muove. Chi viene toccato sente una sottrazione impossibile da descrivere — qualcosa come perdere un'opinione su sé stessi.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata (facoltativa: con For +6 conviene usare Forza). Bonus CA di deviazione. Taglia Grande: portata 1,5 m, BCM/DMC +2, −1 TxC e −1 CA da taglia. Volo libero dal 17°."],"for":6,"des":2,"velocita":"9 m + volo 9 m perfetto (sez. 4.6)","ca_tipo":"deviazione","ca":5,"campi":{"Attacchi":"2 artigli 1d8 + Drenaggio energetico (su artiglio): TS Tempra o 1 livello negativo","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Trappola d'Anime (1/incontro, az. standard, raggio 9 m): un bersaglio vivente, TS Volontà o un frammento della sua anima viene imprigionato nella gabbia toracica del Carnaio. Finché imprigionato: il bersaglio è Barcollante e subisce −2 ai TS contro gli incantesimi del Carnaio. Il frammento torna al bersaglio a fine trasformazione o se il Carnaio è ridotto a 0 PF; Consumare il frammento (az. gratuita, una volta per frammento, scelta tra tre effetti): (a) il Carnaio si cura di 5d6 PF; (b) il prossimo incantesimo lanciato entro 1 round ottiene +2 alla CD; (c) il bersaglio derubato subisce 4d6 danni necrotici (no TS). Dopo il consumo il bersaglio non è più Barcollante."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":2,"nome":"artigli","dado":"1d8","contatto":false,"des":false,"secondario":false}]},{"id":"banshee","nome":"Banshee","cat":"V","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −4, Des +8 — Velocità: volo 18 m perfetto (sez. 4.6) — Deviazione: +5","taglia":"Media","sciame":false,"descr":"La forma è appena abbozzata, come il ricordo di una donna visto da troppo lontano. Vola senza toccare nulla, lasciando un silenzio preciso ovunque passi, e quando decide di urlare il suono non esce come un grido normale: esce come qualcosa che si rompe, qualcosa di strutturale, e tutto ciò che era tenuto insieme smette di esserlo.","note":["Tipo Spirito → Semicorporeo (sez. 4.5). Arma Accurata automatica. Bonus CA di deviazione. Volo libero dal 17°. Nota: il tocco cura gli altri non morti adiacenti, mai il Carnaio (ruolo esclusivo del Sanguigno, Categoria IV)."],"for":-4,"des":8,"velocita":"volo 18 m perfetto (sez. 4.6)","ca_tipo":"deviazione","ca":5,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 6d6 energia negativa — danneggia i viventi; cura gli altri non morti adiacenti della stessa quantità (mai il Carnaio).","Sensi":"Scurovisione 18 m, Percezione dei Vivi 36 m","Qualità":"Semicorporeo; Urlo della morte (1/incontro, az. completa, esplosione raggio 9 m centrata sul Carnaio): tutti i viventi nell'area subiscono 1d6 danni sonori per livello del Carnaio (massimo 15d6), TS Tempra dimezza; chi fallisce il TS di 5 o più viene ridotto a 0 PF e diventa Morente. Creature sorde: +4 al TS (non sono immuni ai danni). Effetto [morte, paura, sonoro]; Lamento costante (passivo): i nemici entro 6 m subiscono −2 alle prove di Concentrazione e ai TS contro effetti [paura]."},"extra":[],"rd":"—","vuln":"luce solare diretta (1d6 danni necrotici per round)","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"6d6","contatto":true,"des":true,"secondario":false}]},{"id":"indigesto","nome":"Indigesto","cat":"V","tipo":"Disarticolato","taglia_raw":"Minuscola","combattente":false,"stat":"For −2, Des +4 — Velocità: 6 m + scalata 6 m + nuoto 9 m — CA naturale: +0 (+2 da taglia Minuscola)","taglia":"Minuscola","sciame":false,"descr":"Non assomiglia a niente di specifico — non ancora. Attende immobile, confuso con il liquame del pavimento, finché qualcosa di caldo non si avvicina. Allora si muove. La digestione, per lui, è ancora un processo in corso: i frammenti che galleggiano dentro di lui appartenevano a qualcun altro, non molto tempo fa.","note":["Talenti automatici (sez. 4.13): Arma Accurata + Manovre Agili. Modificatori taglia Minuscola: +2 TxC, +2 CA, +4 Furtività e Volare, −3 BCM/DMC. Forma: liquame giallastro animato con ossa sciolte e frammenti cranici galleggianti."],"for":-2,"des":4,"velocita":"6 m + scalata 6 m + nuoto 9 m","ca_tipo":"naturale","ca":0,"campi":{"Sensi":"Vista cieca 9 m","Qualità":"Amorfo (immune a danni di precisione e critici); Comprimersi: passa attraverso fessure grandi 1/8 del proprio spazio.","Bonus abilità":"+8 Furtività"},"extra":["Avvolgere (manovra di forma, sez. 4.14, non provoca AdO, bersaglio fino a taglia Grande): il bersaglio avvolto è Intralciato e subisce i seguenti effetti simultanei:","• Acido automatico all'inizio di ogni turno del Carnaio: 1d6 ogni 5 livelli del Carnaio (al 15°: 3d6, al 20°: 4d6).","• Se la testa è avvolta (scelta del Carnaio all'inizio dell'avvolgimento): il bersaglio non può pronunciare componenti verbali.","• TS Tempra ogni round: in caso di fallimento, −1 CA cumulativo (equipaggiamento corroso, riparabile).","• Liberazione: prova di Lotta o Artista della Fuga contro la DMC speciale (sez. 4.14).","Un solo bersaglio avvolto alla volta. Mentre avvolge il Carnaio non può muoversi, ma può castare normalmente (sez. 4.12).","Imboscata perfetta: immobile e inattivo, il Carnaio è indistinguibile da liquame inerte (+20 Camuffare come oggetto). Chi non identifica la forma è Colto alla sprovvista contro il primo Avvolgere."],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[]},{"id":"maestro_della_guerra","nome":"Maestro della Guerra","cat":"VI","tipo":"Scheletro","taglia_raw":"Media","combattente":true,"stat":"For +6, Des +4 — Velocità: 9 m — CA naturale: +5","taglia":"Media","sciame":false,"descr":"Non ha bisogno di inseguire: fa sì che gli altri vengano da lui. Si pianta al centro della battaglia con la certezza di chi conosce ogni passo che il nemico farà, e le braccia che si estendono a tre metri di distanza non sono braccia normali: sono confini. Entrare nella sua zona significa già aver perso qualcosa.","note":["⚔ FORMA COMBATTENTE (sez. 9.7): BAB pieno; +1 PF/DV addizionale (totale +6 PF/DV); capacità minori consentite (Cura rapida, parata). ⛔ ZERO INCANTESIMI — eccezione unica alla sez. 4.12."],"for":6,"des":4,"velocita":"9 m","ca_tipo":"naturale","ca":5,"campi":{"BAB pieno":"pari al livello di Carnaio (al 18°: +18/+13/+8/+3, quattro attacchi; al 20°: +20/+15/+10/+5)","Attacchi":"arma marziale o esotica impugnata (o 2 artigli 1d6)","Sensi":"Scurovisione 18 m","Qualità":"Zona di controllo (portata 3 m): braccia e arma si estendono spettralmente — il Carnaio ha portata 3 m con qualsiasi arma da mischia; AdO illimitati: nessun limite al numero di attacchi di opportunità per round; Nessun passo è sicuro: i nemici entro 3 m che compiono un passo di 1,5 m o che attaccano un bersaglio diverso dal Carnaio provocano un AdO; Parata del maestro (1/round, az. immediata): quando un attacco in mischia colpisce il Carnaio, può fare una prova di TxC contrapposta — se il risultato del Carnaio supera quello dell'attaccante, l'attacco è parato; Cura rapida 5."},"extra":["Competenze: armi marziali ed esotiche da mischia"],"rd":"10/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"arma impugnata","dado":"arma","arma":true,"nota":"arma marziale o esotica impugnata"},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"architetto_dossa","nome":"Architetto d'ossa","cat":"VI","tipo":"Scheletro","taglia_raw":"Enorme","combattente":false,"stat":"For +6, Des −2 — Velocità: 9 m — CA naturale: +6","taglia":"Enorme","sciame":false,"descr":"Solleva muri dal nulla — no, non dal nulla: dall'archivio dei morti che porta con sé. Ogni parete di costole e vertebre che emerge dal terreno è costruita con materiali che avevano già servito una volta. Ridisegna il campo di battaglia con la stessa nonchalance di chi riordina i mobili di una stanza.","note":["Taglia Enorme: portata 4,5 m (3 m con armi da mischia), BCM/DMC +3, −2 TxC e −2 CA da taglia (sez. 3.1). Numero massimo di segmenti attivi = bonus di Carisma del Carnaio."],"for":6,"des":-2,"velocita":"9 m","ca_tipo":"naturale","ca":6,"campi":{"Attacchi":"2 schianti 3d6","Sensi":"Scurovisione 18 m","Qualità":"Muro di ossa (1/round, az. standard, raggio 9 m): il Carnaio erge dal suolo un segmento di muro 3×3 m (PF 30, CA 5, RD 5/contundenti). Il segmento dura fino a fine trasformazione o fino alla distruzione. Max segmenti attivi = bonus Cha; spuntoni: 1d6 danni a chi scala o attraversa varchi rotti; Prigione d'ossa (1/incontro, az. completa): 4 segmenti si chiudono attorno a una creatura Grande o inferiore entro 9 m — TS Riflessi o rinchiusa. Per uscire: distruggere almeno un segmento (dall'interno) o superare una prova di Scalare CD 20 (1d6 danni da spuntoni per ogni tentativo fallito); Rimodellare (az. di movimento): sposta un segmento esistente di 3 m."},"extra":[],"rd":"10/contundenti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":2,"nome":"schianti","dado":"3d6","contatto":false,"des":false,"secondario":false}]},{"id":"zombie_sismico","nome":"Zombie sismico","cat":"VI","tipo":"Zombie","taglia_raw":"Enorme","combattente":false,"stat":"For +8, Des −4 — Velocità: 6 m — CA naturale: +5","taglia":"Enorme","sciame":false,"descr":"Non cammina sul terreno: lo consuma. Ogni passo lascia crepe, ogni pugno mandato a terra si propaga come un tremore che sceglie i propri bersagli. Non ha bisogno di raggiungere i nemici: li abbatte a distanza, e ciò che rimane dietro di lui è terra di nessuno.","note":["Taglia Enorme: portata 4,5/3 m, BCM/DMC +3, −2 TxC e −2 CA da taglia. Le creature in volo sono immuni al Tremore e al Colpo sismico."],"for":8,"des":-4,"velocita":"6 m","ca_tipo":"naturale","ca":5,"campi":{"Attacchi":"2 schianti 3d6 + Polvere della tomba (sul colpo): TS Tempra o Indebolito (−2 Forza) per 1 minuto","Sensi":"Scurovisione 18 m; Percezione tellurica 18 m: avverte automaticamente la posizione di ogni creatura in contatto col suolo entro 18 m.","Qualità":"NON Barcollante; Colpo sismico (az. standard): il Carnaio sferra uno schianto a terra creando un cono 6 m — TS Riflessi o 2d6+For danni e Proni; le caselle del cono diventano terreno difficile permanente (crepe e detriti); Tremore (1/incontro, az. completa, raggio 9 m centrato sul Carnaio): tutti i nemici a contatto col suolo, TS Riflessi o Proni + 1d6 danni contundenti ogni 2 livelli del Carnaio (massimo 10d6), TS dimezza i danni ma non il Prono; strutture nell'area: danni raddoppiati. Creature in volo: immuni."},"extra":[],"rd":"5/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":2,"nome":"schianti","dado":"3d6","contatto":false,"des":false,"secondario":false}]},{"id":"re_ghoul","nome":"Re Ghoul","cat":"VI","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +4, Des +4 — Velocità: 9 m — CA naturale: +4","taglia":"Media","sciame":false,"descr":"Non urla, non corre, non si lancia. Si limita a guardare, con le orbite profonde e immobili che sembrano contenere qualcosa di più antico della morte stessa. Chi incontra quello sguardo vuole distoglierlo — ma distoglierlo significa non vederlo arrivare. Non ci sono opzioni migliori: ci sono solo scelte sbagliate in ordine diverso.","note":["Sguardo paralizzante — raggio dimezzato (4,5 m): punisce chi si avvicina, non l'intero campo. Effetto soprannaturale: non è [influenza mentale], funziona anche su creature con protezioni mentali."],"for":4,"des":4,"velocita":"9 m","ca_tipo":"naturale","ca":4,"campi":{"Attacchi":"morso 1d8 + 2 artigli 1d6; ogni colpo a segno: TS Tempra o Paralizzato 1d4+1 round (elfi NON immuni)","Sensi":"Scurovisione 18 m, Vista in penombra","Qualità":"Sguardo paralizzante (gaze, raggio 4,5 m): ogni nemico che inizia il proprio turno entro 4,5 m guardando il Carnaio, TS Tempra o Paralizzato 1 round (elfi NON immuni). Un nemico che distoglie lo sguardo (dichiarato a inizio turno): evita il TS ma ha 50% miss chance contro il Carnaio per quel round. Effetto soprannaturale (non [influenza mentale]); Banchetto regale: gli attacchi del Carnaio contro bersagli Paralizzati o Indifesi infliggono +4d6 danni aggiuntivi.","Bonus abilità":"+4 Furtività, +4 Intimidire"},"extra":[],"rd":"—","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"morso","dado":"1d8","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"1d6","contatto":false,"des":false,"secondario":false}]},{"id":"fantasma","nome":"Fantasma","cat":"VI","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −4, Des +8 — Velocità: volo 18 m perfetto (libero) — Deviazione: +5","taglia":"Media","sciame":false,"descr":"Passa attraverso le pareti con l'indifferenza di chi non riconosce più la distinzione tra dentro e fuori. Quando sceglie un corpo, si insinua lentamente: prima un peso strano, poi una voce che non è tua, poi nient'altro. Chi lo ospita combatte ogni round per riprendere il controllo — e spesso, per poco, ce la fa.","note":["Tipo Spirito → Semicorporeo (sez. 4.5): 50% danni non magici, 75% magici; attraversa solidi. Arma Accurata automatica. Bonus CA di deviazione. Volo libero. Effetto Malevolenza [possessione]: non morti, costrutti ed esseri senza anima sono immuni."],"for":-4,"des":8,"velocita":"volo 18 m perfetto (libero)","ca_tipo":"deviazione","ca":5,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 4d6 necrotici","Sensi":"Scurovisione 18 m, Percezione dei Vivi 18 m","Qualità":"Semicorporeo; Malevolenza (az. standard, bersaglio adiacente vivente e corporeo): il Carnaio si fonde nel corpo del bersaglio. TS Volontà nega (+ immunità 24h al tentativo successivo). In caso di fallimento, il Carnaio possiede il corpo: controlla i movimenti e le azioni fisiche usando le statistiche fisiche del bersaglio (non le sue capacità di classe, incantesimi o abilità speciali). Mentre possiede, il Carnaio non può lanciare incantesimi. I danni subiti dal corpo posseduto non toccano il Carnaio. A fine di ogni turno della vittima, questa ripete il TS con +1 cumulativo per ogni tentativo precedente: al successo, espelle il Carnaio (che riappare adiacente), la vittima è Barcollante 1 round e immunizza 24h. Il Carnaio può uscire volontariamente come az. gratuita. Effetto [possessione]: non morti, costrutti, senz'anima — immuni; Manifestazione terrificante (1/incontro, az. gratuita): chi vede il Carnaio emergere da muro/pavimento/corpo, TS Volontà o Scosso 1d4 round. Effetto [paura]."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"4d6","contatto":true,"des":true,"secondario":false}]},{"id":"divoramagie","nome":"Divoramagie","cat":"VI","tipo":"Spirito","taglia_raw":"Media","combattente":false,"stat":"For −2, Des +6 — Velocità: volo 15 m perfetto (libero) — Deviazione: +5","taglia":"Media","sciame":false,"descr":"Gli incantesimi che lo colpiscono non esplodono: scompaiono. Li assorbe con la naturalezza di chi ha fame, e quella fame è diretta, tattica, il motivo per cui gli incantatori d'alto livello si fermano quando lo vedono. Non temono il combattimento — temono di rimanere senza strumenti.","note":["Tipo Spirito → Semicorporeo (sez. 4.5). Arma Accurata automatica. Bonus CA di deviazione. Volo libero. Contro nemici non magici è quasi inutile: massimo trade-off della Categoria VI."],"for":-2,"des":6,"velocita":"volo 15 m perfetto (libero)","ca_tipo":"deviazione","ca":5,"campi":{"Attacchi":"tocco di contatto (usa Destrezza per TxC) 3d6 necrotici + Brucia magia: se il bersaglio è un incantatore, TS Volontà o perde 1 slot o preparazione del livello più alto rimasto; il Carnaio recupera PF pari a 5× il livello dello slot bruciato.","Sensi":"Scurovisione 18 m; Individuazione del Magico permanente.","Qualità":"Semicorporeo; Assorbire incantesimo (3/incontro, az. immediata): quando un incantesimo nemico ha come bersaglio il Carnaio o un alleato adiacente — prova 1d20 + livello del Carnaio vs CD 11 + LI dell'incantatore nemico. Successo: l'incantesimo è negato e il Carnaio sceglie tra: (a) recuperare PF pari a 5× il livello dell'incantesimo, oppure (b) ottenere +2 alla CD del prossimo incantesimo lanciato entro 1 round; Aura di interferenza (passiva, raggio 3 m): gli incantatori nemici che lanciano entro 3 m devono superare una prova di Concentrazione (CD sez. 4.9 + livello dell'incantesimo) o perdono l'incantesimo."},"extra":[],"rd":"—","vuln":"—","semicorporeo":true,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"tocco di contatto","dado":"3d6","contatto":true,"des":true,"secondario":false}]},{"id":"vortice_di_reliquie","nome":"Vortice di reliquie","cat":"VI","tipo":"Disarticolato","taglia_raw":"Grande — volante","combattente":false,"stat":"For +2, Des +6 — Velocità: volo 15 m (manovrabilità buona, libero) — CA naturale: +3","taglia":"Grande","sciame":false,"descr":"Non ha una forma precisa: è un tornado di frammenti, lame, ossa e detriti saccheggiati da troppi carnai. L'orbita che lo circonda non è decorativa — è l'arma, è la difesa, è il confine. Si avvicina lentamente, implacabilmente, e chi tira da lontano scopre che i propri proiettili tornano indietro o si perdono nel gorgo.","note":["Taglia Grande: portata 1,5 m, BCM/DMC +2, −1 TxC e −1 CA da taglia. Non è uno sciame: immune a critici e precisione grazie a 'Senza forma stabile'. Volo libero. Lo Scudo di detriti protegge il Carnaio E gli alleati adiacenti."],"for":2,"des":6,"velocita":"volo 15 m (manovrabilità buona, libero)","ca_tipo":"naturale","ca":3,"campi":{"Attacchi":"Scaglia reliquie (az. standard, raggio 18 m, TxC con Destrezza): 1d6 danni ogni 2 livelli del Carnaio (al 18°: 9d6, massimo 10d6), taglienti/perforanti + TS Tempra o Sanguinamento 1d6; Multilancio (az. completa): scaglia 2 reliquie contro lo stesso bersaglio o bersagli diversi.","Sensi":"Vista cieca 12 m","Qualità":"Senza forma stabile: immune a danni di precisione e colpi critici; Orbita tagliente (passiva): chiunque inizi il proprio turno adiacente al Carnaio o entri in uno spazio adiacente subisce automaticamente 4d6 danni taglienti (nessun TS; al 20°: 5d6); le creature in volo adiacenti devono superare un TS Riflessi o sono Prone in aria e cadono; Scudo di detriti (passivo): gli attacchi a distanza con proiettili fisici contro il Carnaio e gli alleati adiacenti hanno 50% di probabilità di essere deflessi; i proiettili deflessi vengono assorbiti nell'orbita.","Bonus abilità":"+8 Volare"},"extra":[],"rd":"—","vuln":"+50% danni da area","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[]},{"id":"lich","nome":"Lich","cat":"Speciale","tipo":"Scheletro","taglia_raw":"Media","combattente":false,"stat":"For +0, Des +2 — Velocità: 9 m — CA naturale: +5","taglia":"Media","sciame":false,"descr":"Non c'è più distinzione tra lui e la magia che lancia: si sono fusi a livello fondamentale. Ogni incantesimo che produce è più potente, più lungo, più profondo di quanto dovrebbe essere per qualunque limite teorico. Le proprie ossa sono diventate un'estensione della volontà stessa — e quella volontà non ha più intenzione di fermarsi.","note":["Apoteosi del caster. L'Eco della filatteria fornisce +1 slot per ogni livello lanciabile (al 20°: +1 slot dal 1° al 9° = 9 slot extra). L'Eco arcano bypassa i cap di danno: una Palla di Fuoco con LI effettivo 22 causa fino a 22d6. Nessuna forma combattente: in forma Lich si casta normalmente."],"for":0,"des":2,"velocita":"9 m","ca_tipo":"naturale","ca":5,"campi":{"Attacchi":"tocco (TxC contatto) 1d8+5 necrotici + Paralisi: TS Tempra o Paralizzato 1d6 round; chi fallisce il TS di 5 o più è Paralizzato finché non viene rimosso magicamente (sembra morto: Guarire CD 20 per accorgersene).","Sensi":"Scurovisione 18 m; Vista del Vero 9 m (il Carnaio vede attraverso illusioni e camuffamenti entro 9 m).","Qualità":"Aura di terrore (raggio 9 m): chi entra nell'aura o inizia il turno al suo interno, TS Volontà o Scosso 1d4 round; le creature con DV inferiori alla metà del livello del Carnaio sono invece Spaventate. Effetto [paura]."},"extra":["Amplificazione arcana: +1 alla CD di tutti gli incantesimi del Carnaio + +2 al LI effettivo (durata, danni, penetrazione RI).","Eco arcano: gli incantesimi ignorano i limiti massimi di danno e durata legati al LI — scalano fino al LI effettivo (LI base +2). Es.: Palla di Fuoco con LI 22 causa fino a 22d6; durate che toppano a 10 round scalano normalmente.","Eco della filatteria: finché in forma Lich, il Carnaio guadagna +1 slot incantesimo per ogni livello che può lanciare (al 20°: +1 slot dal 1° al 9°). Gli slot extra svaniscono a fine trasformazione se non usati."],"rd":"10/— (pura, nessun tipo la supera)","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"tocco","dado":"1d8+5","contatto":true,"des":false,"secondario":false}]},{"id":"tarrasque_putrescente","nome":"Tarrasque putrescente","cat":"Speciale","tipo":"Zombie","taglia_raw":"Enorme","combattente":false,"stat":"For +10, Des −4 — Velocità: 9 m — CA naturale: +8","taglia":"Enorme","sciame":false,"descr":"Quello che si vede non è un mostro: è un fenomeno geografico. Si muove lentamente, con la certezza di chi sa che il tempo lavora per lui. Le spine che scaglia a distanza sembrano provenire da una catapulta, e il carapace riflette i raggi con la nonchalance di uno specchio. Abbatterlo richiede uno sforzo collettivo sostenuto — finché c'è energia positiva, non scende sotto un punto ferita.","note":["BAB ¾ (al 20°: +15/+10/+5) — NON è forma combattente (sez. 9.7): in questa forma il Carnaio può ancora lanciare incantesimi. Taglia Enorme: portata 4,5/3 m, BCM/DMC +3, −2 TxC e −2 CA. PF totali: +8 PF/DV (=+6 di categoria +2 extra). RI = 11 + livello del Carnaio (al 20°: RI 31)."],"for":10,"des":-4,"velocita":"9 m","ca_tipo":"naturale","ca":8,"campi":{"BAB ¾":"al 20° = +15/+10/+5 (tre attacchi con attacco completo; TxC con Forza = +10+15 = +25 al primo attacco)","Attacchi":"morso 4d6 (critico 19-20/×3) + 2 artigli 2d6","Sensi":"Scurovisione 18 m, Olfatto","Qualità":"NON Barcollante; Rigenerazione 10: sospesa per 1 round solo dai danni di energia positiva; finché attiva il Carnaio non scende sotto 1 PF; Inghiottire (manovra di forma sez. 4.14, su morso riuscito contro Grande o inferiore): 3d6 danni (acido + contundente) per round dentro, il bersaglio è Intralciato; uscita: 15 danni taglienti dall'interno (CA interna 12); Carapace marcio: raggi e linee magiche dirette contro il Carnaio hanno 30% di essere riflesse verso il mittente (verificato prima del TxC o TS)."},"extra":["Lancio di spine ossee (az. standard, raggio 36 m): fino a 4 spine, TxC a distanza con Forza (BAB ¾ + For), 2d6+For danni ciascuna, contro bersagli uguali o diversi."],"rd":"10/taglienti","vuln":"—","semicorporeo":false,"incorporeo":false,"umanoide":false,"armi":[{"n":1,"nome":"morso","dado":"4d6","contatto":false,"des":false,"secondario":false},{"n":2,"nome":"artigli","dado":"2d6","contatto":false,"des":false,"secondario":false}]},{"id":"vampiro","nome":"Vampiro","cat":"Speciale","tipo":"Ghoul","taglia_raw":"Media","combattente":false,"stat":"For +6, Des +6 — Velocità: 9 m + scalata 9 m (Movimenti del Ragno) — CA naturale: +6","taglia":"Media","sciame":false,"descr":"Ha imparato da secoli di osservazione a sembrare vivo quando vuole, morto quando serve, e nessuna delle due cose quando sceglie di mostrarsi per quello che è. La voce che usa per dominare non è la stessa voce che usa per parlare — è qualcosa di più antico, che bypassa il ragionamento e va direttamente alla volontà.","note":["Schiavi del sangue = creazione non morti (sez. 4.10 — privilegio esclusivo della Categoria Speciale). Max 2 schiavi attivi contemporaneamente; durano 1 ora o fino a fine trasformazione."],"for":6,"des":6,"velocita":"9 m + scalata 9 m (Movimenti del Ragno)","ca_tipo":"naturale","ca":6,"campi":{"Attacchi":"schianto 1d8 + Drenaggio energetico: TS Tempra o 2 livelli negativi; il Carnaio guadagna 5 PF temporanei per ogni livello negativo inflitto (1 ora).","Sensi":"Scurovisione 18 m","Qualità":"Cura rapida 5; Dominio (gaze, az. standard, raggio 9 m): TS Volontà o Dominato (come Dominare Persona, LI = livello, nessuna concentrazione). Fino a 2 bersagli dominati simultaneamente (il terzo libera il più vecchio). Effetto [influenza mentale, compulsione]; Fascino della notte (aura, raggio 6 m): i nemici nell'aura subiscono −2 ai TS contro gli effetti [influenza mentale] del Carnaio (Dominio e incantesimi); Figli della notte (1/incontro, az. standard): evoca 1d4+1 sciami di pipistrelli (2d6 automatici, Distrazione TS Tempra o Nauseato; volo 12 m) che obbediscono per 1 minuto; Schiavi del sangue ⚠ (creazione non morti, sez. 4.10): un umanoide portato a Cos 0 dal Morso del sangue si rialza dopo 1d4 round come schiavo vampirico (statistiche dello Zombie veloce). Max 2 schiavi, durano 1 ora; Forma di nube (az. standard): come Forma Gassosa (volo 6 m perfetto)."},"extra":["Morso del sangue (su bersaglio In Lotta, Paralizzato, Indifeso o consenziente): drenaggio 1d4 Cos (senza limite cumulativo; Cos 0 → Morto) + il Carnaio si cura di 5 PF per punto drenato."],"rd":"—","vuln":"luce solare diretta (Barcollante + 2d6 necrotici/round); acqua corrente (attraversabile solo in Forma di nube)","semicorporeo":false,"incorporeo":false,"umanoide":true,"armi":[{"n":1,"nome":"schianto","dado":"1d8","contatto":false,"des":false,"secondario":false}]},{"id":"tenebra_camminante","nome":"Tenebra Camminante","cat":"Speciale","tipo":"Spirito","taglia_raw":"Enorme","combattente":false,"stat":"For — (irrilevante — tutti gli attacchi sono di contatto), Des +4 — Velocità: 12 m + volo 9 m perfetto (libero) — Deviazione: +6","taglia":"Enorme","sciame":false,"descr":"Non è un'ombra: è l'assenza di luce in forma pensante. Si muove attraverso i muri con l'indifferenza di un pensiero cattivo, e dove passa le luci non si spengono per il vento — si spengono perché ha deciso che si spengano. Gli uncini d'ombra che distende sono attacchi di contatto: non toccano la carne, toccano qualcosa di più difficile da riparare.","note":["⚠ INCORPOREO — esclusiva assoluta della Categoria Speciale (sez. 4.5): immune ai danni non magici; 50% dai magici (effetti di forza: danno pieno); attraversa i solidi. Tutti gli attacchi della forma sono attacchi di contatto. Bonus CA di deviazione (vale anche su CA di contatto). La Forza è irrilevante: usare sempre Destrezza. Taglia Enorme: portata 4,5/3 m, −2 TxC e −2 CA da taglia. Volo libero."],"for":null,"des":4,"velocita":"12 m + volo 9 m perfetto (libero)","ca_tipo":"deviazione","ca":6,"campi":{"Attacchi":"2 artigli d'ombra (attacchi di contatto, usa Des per TxC): 3d6 gelo necrotico ciascuno","Sensi":"Scurovisione 36 m, Percezione dei Vivi 18 m","Qualità":"Incorporeo; Divorare la luce (aura, raggio 9 m): le luci non magiche si spengono; gli effetti di luce magica di livello inferiore a metà del livello del Carnaio vengono dissolti; l'intera aura è zona di penombra; Marea di tenebre (3/trasformazione, az. standard): crea Tenebre Profonde (LI = livello del Carnaio); Terrore della notte (1/incontro, az. gratuita, raggio 9 m): TS Volontà o Spaventato 1d4 round. Effetto [paura]."},"extra":["Calpestare l'ombra (az. standard, bersaglio entro portata con un'ombra visibile): TS Volontà o 6d6 danni necrotici + Intralciato 1d4 round (l'ombra è inchiodata al suolo). Effetto [ombra]. Inefficace in oscurità totale o luce uniforme senza ombre."],"rd":"(superflua: Incorporeo)","vuln":"luce solare diretta (2d6 necrotici/round)","semicorporeo":false,"incorporeo":true,"umanoide":false,"armi":[{"n":2,"nome":"artigli d'ombra","dado":"3d6","contatto":true,"des":true,"secondario":false}]},{"id":"legione_sciolta","nome":"Legione Sciolta","cat":"Speciale","tipo":"Disarticolato","taglia_raw":"3 parti autonome — design custom","combattente":false,"stat":"Des +0 — Velocità: volo 18 m perfetto (libero)","taglia":"Media","sciame":false,"descr":"Si separa con una precisione chirurgica: la testa per pensare e lanciare, il torso per reggere i colpi, le braccia per aggredire da ogni angolo. In teoria sono tre cose diverse. function domNoteEvoca(tipo,g){
  const n=[];if(!g)return n;const g2=g>=5?2:1;
  const T={Scheletro:[`+2 Iniziativa`,`+${g2} TxC (sciami: +${g2} CD Distrazione)`,`+1 PF per DV`,`+${g2} TS`,`25% di ignorare i critici`],
   Spirito:[`Schivare e Mobilità`,`+1 PF per DV`,`Attacco rapido`,`livelli negativi inflitti entro 18 m: 10 PF temp. al necrarca e +1 LI per 10 min`,`+1 livello negativo extra`],
   Zombie:[`Passo leggero`,`+${g2} TxC (sciami: +${g2} CD Distrazione)`,`+1 PF per DV`,`+${g2} TS`,`minaccia di critico +1 sugli attacchi naturali`],
   Disarticolato:[`+3 m velocità su terreno`,`+${g2} CD capacità Str/Sop`,`+1 PF per DV`,`+${g2} TS`,`+1 schivare alla CA`],
   Ghoul:[`Banchetto sanguinario`,`+${g2} TxC (sciami: +${g2} CD Distrazione)`,`+1 PF per DV`,`+${g2} TS`,`+1 CD capacità Str/Sop`]}[tipo];
  for(let i=0;i<g;i++)n.push(`${['I','II','III','IV','V'][i]}: ${T[i]}`);return n;
}
function applyDom(c){
  const g=grado(c.tipo),g2=g>=5?2:1,o=JSON.parse(JSON.stringify(c));o.mod={};
  const noCombat=c.id==='mezzo_ghoul_servitore';
  const addTxc=(s,k)=>s.replace(/([+−-])(\d+)(?=( a contatto| di contatto| a distanza| con [^()]{1,20})? \()/g,(m,sgn,d)=>{const v=(sgn==='+'?1:-1)*+d+k;return `\u0001${sg(v)}\u0002`;});
  const addCd=(s,k)=>s.replace(/CD (\d+)/g,(m,d)=>`CD \u0001${+d+k}\u0002`);
  const txc=(['Scheletro','Zombie','Ghoul'].includes(c.tipo)&&g>=2&&!noCombat)?g2:0;
  let cd=0;if(c.tipo==='Disarticolato'&&g>=2)cd+=g2;if(c.tipo==='Ghoul'&&g>=5)cd+=1;
  if(txc){if(c.sciame){cd+=g2;}else o.attacchi=o.attacchi.map(a=>addTxc(a,txc));}
  if(cd){o.att_speciali=addCd(o.att_speciali,cd);o.attacchi=o.attacchi.map(a=>addCd(a,cd));o.capacita=o.capacita.map(x=>(x.tipo==='Sop'||x.tipo==='Sfo')?{...x,testo:addCd(x.testo,cd)}:x);}
  if(g>=3){o.pf+=c.dv;o.mod.pf=1;}
  if(g>=4&&c.tipo!=='Spirito'&&!noCombat){for(const k in o.ts)o.ts[k]+=g2;o.mod.ts=1;}
  if(c.tipo==='Scheletro'&&g>=1){o.iniziativa+=2;o.mod.ini=1;}
  let dodge=0;if(c.tipo==='Spirito'&&g>=1)dodge++;if(c.tipo==='Disarticolato'&&g>=5)dodge++;
  if(dodge){o.ca+=dodge;o.contatto+=dodge;o.mod.ca=1;}
  if(c.tipo==='Disarticolato'&&g>=1){o.velocita=o.velocita.replace(/^(\d+) m/,(m,d)=>`${+d+3} m`);o.mod.vel=1;}
  o.dom=domNoteEvoca(c.tipo,g);return o;
}

function calcForma(f){
  const l=S.livello,t=TAGLIA[f.taglia],cb=CAT_B[f.cat],gC=gradoCarnaio(),dom=S.dominio,g2=gC>=5?2:1;
  const For=f.for==null?null:S.For+f.for,Des=S.Des+f.des,fm=For==null?null:mod(For),dm=mod(Des);
  let B=bab(),babNota='';
  if(f.combattente){B=l;babNota='forma da combattente: BAB pari al livello';}
  if(f.id==='tarrasque_putrescente'){B=Math.floor(l*3/4);babNota='BAB ¾ del livello';}

  let domTxc=0;if(['Scheletro','Zombie','Ghoul'].includes(dom)&&gC>=2)domTxc=g2;
  const it=iter(B);
  const armi=f.armi.map(a=>{
    if(a.arma)return {nome:'Arma impugnata',txt:'usa l’arma del personaggio (TxC e danni del personaggio)'};
    if(a.sciame)return {nome:'Danni da sciame',txt:`${a.dado} automatici${f.id!=='legione_sciolta'&&domTxc?'':''}`};
    const useDes=fm==null||a.des||(a.contatto&&accurata)||(accurata&&dm>fm);
    const st=useDes?dm:fm;const m=st+t.txc+domTxc-(a.secondario?5:0);
    let dmg=a.dado,bon=0;
    if(/\+For$/.test(dmg)){dmg=dmg.replace('+For','');bon=fm||0;}
    else if(!/\+\d+$/.test(dmg)&&!a.contatto&&fm!=null){bon=a.secondario?Math.floor(fm/2):fm;}
    return {nome:(a.n>1?a.n+' ':'')+a.nome+(a.contatto?' (contatto)':'')+(a.secondario?' (secondario)':''),
      txt:`${it.map(b=>sg(b+m)).join('/')} · ${dmg}${bon?sg(bon):''}`,stat:useDes?'Des':'For'};
  });
  const humanoid=f.umanoide;
  let arm=humanoid?(+S.armatura||0)+(+S.scudo||0):0;if(f.id==='cavaliere_della_tomba')arm=Math.max(9,+S.scudo||0)+0;
  let dev=+S.deviazione||0,nat=+S.naturale||0;
  if(f.ca_tipo==='deviazione')dev=Math.max(dev,f.ca);else nat=Math.max(nat,f.ca);
  let dodge=+S.schivare||0;if(dom==='Spirito')dodge+=1;if(dom==='Disarticolato'&&gC>=5)dodge+=1;
  const altro=+S.caAltro||0;
  const CA=10+dm+t.ca+arm+dev+nat+dodge+altro, cont=10+dm+t.ca+dev+dodge+altro, impr=CA-Math.max(0,dm)-dodge;
  let pfT=cb*l+(f.combattente?l:0)+(gC>=3?l:0);if(f.id==='tarrasque_putrescente')pfT+=2*l;
  let tsB=gC>=4?g2:0;
  let ini=dm+(+S.iniAltro||0)+(dom==='Scheletro'?2:0);
  const bmcStat=['Minuscola','Piccola'].includes(f.taglia)||fm==null?dm:fm;
  const BMC=B+bmcStat+t.bmc, DMC=10+B+(fm??0)+dm+t.bmc+dodge+dev;
  const cm=carMod(),manF=l+cm+4;
  let cd=10+Math.floor(l/2)+cm;if(dom==='Disarticolato'&&gC>=2)cd+=g2;if(dom==='Ghoul'&&gC>=5)cd+=1;
  let vel=f.velocita.replace(/\(max 1 m[^)]*\)/,l>=17?'(altezza libera)':'(max 1 m)').replace(/\(sez\. 4\.6\)/,l>=17?'(altezza libera)':'(max 1 m dal suolo)');
  if(dom==='Disarticolato')vel+=' · +3 m su terreno (Dominio I)';

}

}
function schedaForma(id){
  const f=FORME.find(x=>x.id===id),c=calcForma(f),ok=formaSbloccata(f),l=S.livello,cb=CAT_B[f.cat];
  const usi=l>=20?Infinity:1+Math.floor(l/2);
  const incant=f.combattente?'Vietati in questa forma (forma da combattente).':f.umanoide?'Può parlare e lanciare incantesimi con componenti verbali e somatiche.':'Non può parlare né lanciare incantesimi con componenti verbali o somatiche. L’oro reagente resta utilizzabile.';
  const equip=f.umanoide?'Mantiene e usa l’equipaggiamento indossato e impugnato.':'L’equipaggiamento si fonde nel corpo; funzionano solo gli oggetti a bonus costante o ad attivazione mentale.';
  const campi=f.campi;
  return `<div class="sheet"><div class="sheetHead"><div><span class="label">Categoria ${f.cat} · ${f.tipo} · ${f.taglia}${f.combattente?' · forma da combattente':''}</span><h2>${esc(f.nome)}</h2></div><button class="btn" data-close>Chiudi</button></div>
  <p class="txt" style="font-style:italic;margin:0">${esc(f.descr)}</p>
  ${f.note.map(n=>`<p class="note" style="margin:0">${fmt(n)}</p>`).join('')}
  ${f.id==='legione_sciolta'?`<div class="banner">Forma in tre parti autonome, ognuna con PF, CA e attacchi propri.</div>${vLegione(c.pfT)}`:''}
  ${f.id==='legione_sciolta'?`<div class="kv"><div><span class="label">PF temporanei</span><b>+${c.pfT}</b><span class="note">divisi tra le parti</span></div><div><span class="label">BAB</span><b>${sg(c.B)}</b></div><div><span class="label">CD capacità</span><b>${c.cd}</b></div><div><span class="label">Manovre di forma</span><b>${sg(c.manF)} / ${10+c.manF}</b></div></div>`:`<div class="kv">
   <div><span class="label">CA</span><b>${c.CA}</b><span class="note">contatto ${c.cont} · impr. ${c.impr}</span></div>
   <div><span class="label">PF temporanei</span><b>+${c.pfT}</b><span class="note">${cb}×${l}${f.combattente?` +${l} comb.`:''}${gradoCarnaio()>=3?` +${l} dominio`:''}</span></div>
   <div><span class="label">Iniziativa</span><b>${sg(c.ini)}</b></div>
   <div><span class="label">BAB</span><b>${sg(c.B)}</b><span class="note">${c.babNota||'del personaggio'}</span></div>
   <div><span class="label">Forza</span><b>${c.For==null?'—':c.For}</b><span class="note">${c.fm==null?'irrilevante':sg(c.fm)} (${f.for==null?'—':sg(f.for)})</span></div>
   <div><span class="label">Destrezza</span><b>${c.Des}</b><span class="note">${sg(c.dm)} (${sg(f.des)})</span></div>
  </div>
  <div class="kv">
   <div><span class="label">Tempra</span><b>${sg((+S.tsT)+c.tsB)}</b></div><div><span class="label">Riflessi</span><b>${sg((+S.tsR)+c.tsB+(c.dm-mod(S.Des)))}</b></div><div><span class="label">Volontà</span><b>${sg((+S.tsV)+c.tsB)}</b></div>
   <div><span class="label">CD capacità</span><b>${c.cd}</b></div><div><span class="label">BMC / DMC</span><b>${sg(c.BMC)} / ${c.DMC}</b></div><div><span class="label">Manovre di forma</span><b>${sg(c.manF)} / ${10+c.manF}</b></div>
  </div>
  ${cb?`<p class="note" style="margin:0">+${cb} circostanziale ai TS contro influenza mentale, malattia, sonno, stordimento e veleno.${c.tsB?` TS già inclusi +${c.tsB} di dominio.`:''}</p>`:''}
  `}${f.id==='legione_sciolta'?'':`<div class="atk"><span class="label">Attacco completo: ${c.it.length} attacc${c.it.length>1?'hi':'o'} a scelta (${c.it.map(sg).join('/')})</span>
   ${c.armi.map(a=>`<div class="l"><span>${esc(a.nome)}</span><span>${esc(a.txt)}</span></div>`).join('')||'<span class="note">Nessun attacco calcolabile: vedi il testo.</span>'}
   <div class="txt" style="margin-top:4px">${fmt(campi['Attacchi']||'')}</div>
   ${campi['BAB pieno']?`<p class="note">${fmt(campi['BAB pieno'])}</p>`:''}${campi['BAB ¾']?`<p class="note">${fmt(campi['BAB ¾'])}</p>`:''}
   <p class="note">Attacchi secondari −5. ${c.accurata?'Arma Accurata: usa la Destrezza se più alta. ':''}${l>=17?'Gli attacchi naturali superano qualsiasi RD.':l>=8?'Attacchi naturali magici.':''}</p>
  </div>`}
  <div class="txt">
   ${f.id==='legione_sciolta'?'':`<p><b>Velocità:</b> ${fmt(c.vel)}</p>`}
   ${f.id==='legione_sciolta'?'':`<p><b>CA:</b> ${f.ca_tipo==='deviazione'?`deviazione ${sg(f.ca)}`:`naturale ${sg(f.ca)}`} · taglia ${sg(TAGLIA[f.taglia].ca)}${c.arm?` · armatura/scudo ${sg(c.arm)}`:''}${c.dodge?` · schivare ${sg(c.dodge)}`:''} · portata ${TAGLIA[f.taglia].port}</p>`}
   ${campi['Sensi']?`<p><b>Sensi:</b> ${fmt(campi['Sensi'])}</p>`:''}
   ${campi['Qualità']?`<p><b>Qualità:</b> ${fmt(campi['Qualità'])}</p>`:''}
   ${campi['Bonus abilità']?`<p><b>Bonus abilità:</b> ${fmt(campi['Bonus abilità'])}${TAGLIA[f.taglia].furt?` · Furtività ${sg(TAGLIA[f.taglia].furt)} da taglia`:''}</p>`:''}
   <p><b>RD:</b> ${fmt(f.rd||'—')} · <b>Vulnerabilità:</b> ${fmt(f.vuln||'—')}</p>
   ${f.extra.map(e=>`<p>${fmt(e)}</p>`).join('')}
   ${f.semicorporeo?`<p><b>Semicorporeo:</b> 50% dei danni da fonti non magiche, 75% da fonti magiche; attraversa oggetti e creature solide; non è invisibile.</p>`:''}
   ${f.incorporeo?`<p><b>Incorporeo:</b> immune ai danni non magici, 50% da fonti magiche (forza: danno pieno); attacchi di contatto.</p>`:''}
   <p><b>Equipaggiamento:</b> ${equip}</p><p><b>Incantesimi:</b> ${incant}</p>
   <p class="note">Subisce le vulnerabilità della forma ma non ne ottiene le immunità. Individuato come non morto.</p>
  </div>
  ${domNoteForma().length?`<div class="banner"><b>Dominio dei ${FAM[S.dominio]}</b> (già inclusi nei valori):<br>${domNoteForma().map(esc).join('<br>')}</div>`:''}
  <div class="row"><button class="btn pri" data-trasf="${f.id}" ${ok&&l>=4&&(usi===Infinity||S.usiForma<usi)?'':'disabled'}>Trasformati (1 uso)</button>${ok?'':`<span class="note">${f.cat==='Speciale'?'Forma speciale non disponibile':'Disponibile dal '+CAT_LV[f.cat]+'° livello'}</span>`}</div></div>`;
}

/* ---------- eventi ---------- */
function openModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="overlay" id="ov"><div class="card">${html}</div></div>`;
  m.querySelector('#ov').onclick=e=>{if(e.target.id==='ov')closeModal();};bindModal(m);}
function closeModal(){document.getElementById('modal').innerHTML='';}
function bindModal(m){
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.rituale=[...(S.rituale||[]),b.dataset.add];save();closeModal();render();});
  m.querySelectorAll('[data-trasf]').forEach(b=>b.onclick=()=>{const f=FORME.find(x=>x.id===b.dataset.trasf);S.formaAttiva=f.id;S.pfTemp=calcForma(f).pfT;if(f.id==='legione_sciolta')S.legPf=LEGIONE.map(p=>calcParte(p,S.pfTemp).pf);if(S.livello<20)S.usiForma++;save();closeModal();render();});
}
function bind(){
  const m=document.getElementById('main');
  m.querySelectorAll('[data-k]').forEach(el=>el.onchange=()=>{const k=el.dataset.k;let v=el.type==='checkbox'?el.checked:el.value;
    if(el.type==='number'&&k!=='babOverride')v=v===''?0:+v;if(k==='livello')v=Math.max(1,Math.min(20,v));S[k]=v;if(k==='archetipo'){S.carnaio=v==='carnaio';if(!S.carnaio){S.formaAttiva=null;S.pfTemp=0;}}S.esempio=false;save();render();});
  m.querySelectorAll('[data-g]').forEach(el=>el.onchange=()=>{S.gradi[el.dataset.g]=+el.value;S.esempio=false;save();render();});
  m.querySelectorAll('[data-d]').forEach(el=>el.onchange=()=>{S.doti[el.dataset.d]=el.checked;save();render();});
  const q=(id,fn)=>{const e=m.querySelector('#'+id);if(e)e.onclick=fn;};
  q('riposo',()=>{S.usiEvoca=0;S.usiForma=0;S.usiOrda=0;save();render();});
  q('evUsa',()=>{S.usiEvoca++;save();render();});q('evRid',()=>{S.usiEvoca=Math.max(0,S.usiEvoca-1);save();render();});
  q('fmRid',()=>{S.usiForma=Math.max(0,S.usiForma-1);save();render();});
  q('fmEnd',()=>{S.formaAttiva=null;S.pfTemp=0;S.legPf=null;save();render();});
  q('goProf',()=>{S.tab='profilo';save();render();});
  q('ritX',()=>{S.rituale=[];save();render();});
  q('ritOk',()=>{for(const id of S.rituale){const c=applyDom(MORTI.find(x=>x.id===id));S.schierati.push({id,pf:c.pf,focale:false});}S.rituale=[];S.usiEvoca++;save();render();});
  m.querySelectorAll('[data-rrm]').forEach(b=>b.onclick=()=>{S.rituale.splice(+b.dataset.rrm,1);save();render();});
  const cerca=m.querySelector('#cerca');if(cerca)cerca.oninput=()=>{S.cerca=cerca.value;const p=cerca.selectionStart;render();const c2=document.getElementById('cerca');c2.focus();c2.setSelectionRange(p,p);};
  m.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{S.filtroTipo=b.dataset.ft;save();render();});
  m.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>openModal(schedaMorto(b.dataset.mo)));
  m.querySelectorAll('[data-fo]').forEach(b=>b.onclick=()=>openModal(schedaForma(b.dataset.fo)));
  m.querySelectorAll('[data-xs]').forEach(b=>b.onclick=()=>{const id=b.dataset.xs;S.extraSpeciali=S.extraSpeciali.includes(id)?S.extraSpeciali.filter(x=>x!==id):[...S.extraSpeciali,id];save();render();});
  m.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{const a=S.schierati[+b.dataset.hp];a.pf+=+b.dataset.v;save();render();});
  m.querySelectorAll('[data-hpset]').forEach(el=>el.onchange=()=>{S.schierati[+el.dataset.hpset].pf=+el.value||0;save();render();});
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.schierati.splice(+b.dataset.rm,1);save();render();});
  m.querySelectorAll('[data-foc]').forEach(b=>b.onclick=()=>{const a=S.schierati[+b.dataset.foc];a.focale=!a.focale;save();render();});
  m.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{S.pfTemp=Math.max(0,S.pfTemp+ +b.dataset.tp);save();render();});
  m.querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>{S.legPf[+b.dataset.lp]+=+b.dataset.v;save();render();});
  m.querySelectorAll('[data-lpset]').forEach(el=>el.onchange=()=>{S.legPf[+el.dataset.lpset]=+el.value||0;save();render();});
  m.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{const f=famiglio();S.famPf=b.dataset.fp==='full'?f.pf:S.famPf+ +b.dataset.fp;save();render();});
  const fp=m.querySelector('#famPf');if(fp)fp.onchange=()=>{S.famPf=+fp.value||0;save();render();};
  q('ordaUsa',()=>{S.usiOrda++;save();render();});
  const tp=m.querySelector('#tpSet');if(tp)tp.onchange=()=>{S.pfTemp=Math.max(0,+tp.value||0);save();render();};
}
render();
</script>

</body>
