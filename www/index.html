<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Grimorio del Necrarca</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" href="icona.png">
<style>
:root{
  --bg:#ECE9E4; --surface:#F7F5F1; --surface2:#E2DED7; --line:#CFC9BF;
  --ink:#211E24; --muted:#6A6470; --accent:#6B4E8C; --accent-ink:#FFFFFF;
  --bronze:#8A6A2E; --cond:#B3121B; --good:#2E6B4A; --warn:#9A5B12;
  --mark:#E7DDF1;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15141A; --surface:#1F1D25; --surface2:#2A2731; --line:#3A3642;
    --ink:#ECE7DF; --muted:#A39CA8; --accent:#B79BD8; --accent-ink:#1A1520;
    --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
    --mark:#3B2F4B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15141A; --surface:#1F1D25; --surface2:#2A2731; --line:#3A3642;
  --ink:#ECE7DF; --muted:#A39CA8; --accent:#B79BD8; --accent-ink:#1A1520;
  --bronze:#D0AE6B; --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A;
  --mark:#3B2F4B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 80px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.8rem}
nav.tabs{display:flex;gap:6px;margin-top:10px}
nav.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .9rem var(--f-body);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:18px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.15rem;margin:0 0 8px;letter-spacing:.03em;color:var(--bronze)}
h3{font-size:.95rem;margin:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.field{display:grid;gap:3px}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.banner{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.stat b{font:500 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.stat .ctr{display:flex;gap:6px;margin-top:4px}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.item.locked{opacity:.45;cursor:default}
.item>.row{flex-wrap:nowrap;flex-shrink:0}
.item .meta{color:var(--muted);font-size:.8rem}
.tag{font:500 .7rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.cb{background:var(--bronze);color:var(--surface)}
.catHead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.sheet{display:grid;gap:12px}
.sheetHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{margin:0;font-size:1.35rem;color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv b{display:block;font:500 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.txt{font-size:.9rem}
.txt p{margin:4px 0}
.atk{display:grid;gap:4px;font-size:.9rem}
.atk .l{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:4px}
.atk .l span:last-child{font-family:var(--f-mono);text-align:right}
.note{font-size:.82rem;color:var(--muted)}
.warn{color:var(--warn)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
.cond{color:var(--cond);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,8,14,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.overlay .card{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.hp{display:flex;align-items:center;gap:6px}
.hp input{width:64px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono);text-align:center}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.low{background:var(--cond)}
.active{display:grid;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.active.focal{border-style:dashed}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion: no-preference){.overlay .card{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>

<script>
const MORTI = [{"id":"carcassa","nome":"Carcassa","livello":1,"tipo":"Zombie","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":-1,"descr":"Poco più di carne putrescente animata dalla volontà del necrarca, la carcassa è la più rudimentale delle sue creazioni. Barcolla verso il nemico con ferocia cieca, incapace di fermarsi finché non cade in polvere.","extra":[],"capacita":[{"nome":"Barcollante","tipo":"Sfo","testo":"La carcassa ha sempre la condizione [BARCOLLANTE] ma può effettuare cariche muovendosi alla propria velocità base."}],"ca":11,"contatto":8,"impreparato":11,"pf":5,"dv":1,"ts":{"Tempra":2,"Riflessi":0,"Volontà":0},"velocita":"9 m","attacchi":["Schianto +3 (1d4+2)"],"att_speciali":"Barcollante","car":{"For":16,"Des":8,"Cos":null,"Int":2,"Sag":10,"Car":10},"bmc":"BMC +4, DMC 14","talenti":"nessuno","abilita":"nessuna"},{"id":"mucchio_dossa","nome":"Mucchio d'ossa","livello":1,"tipo":"Scheletro","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Un groviglio di ossa spezzate e denti scheggati che tintinna avanzando. Non ha più carne né scopo — solo il ricordo istintivo di graffiare e squarciare qualunque cosa si muova.","extra":["Immunità: Freddo"],"capacita":[],"ca":14,"contatto":12,"impreparato":10,"pf":6,"dv":1,"ts":{"Tempra":0,"Riflessi":2,"Volontà":0},"velocita":"9 m","attacchi":["2 Artigli +2 (1d4+1)"],"att_speciali":"","car":{"For":10,"Des":14,"Cos":null,"Int":2,"Sag":10,"Car":10},"bmc":"BMC +0, DMC 11","talenti":"Schivare","abilita":"nessuna"},{"id":"necrosciame","nome":"Necrosciame","livello":1,"tipo":"Zombie","taglia":"sciame di minuscoli","sciame":true,"focus":false,"nota":"","iniziativa":0,"descr":"Una massa brulicante di frammenti di carne, insetti necrotici e schegge ossee che si muove come un'unica entità ribollente. Ciò che non riesce a distruggere, lo logora dall'interno.","extra":["Capacità difensive: tratti degli sciami"],"capacita":[{"nome":"Tratti degli sciami","tipo":"Sfo","testo":"Uno sciame di minuscoli è immune a qualsiasi danno da arma singola. Subisce danno dimezzato da armi taglienti e perforanti, danno normale da armi contundenti e +50% di danno da effetti ad area. È immune a [FRASTORNAMENTO] e manovre di combattimento. Non può essere [IN LOTTA]. Occupa uno spazio di 3 m × 3 m."},{"nome":"Brulicare","tipo":"Sop","testo":"Ogni creatura che si trova nello spazio dello sciame al termine del proprio turno deve superare un TS su Tempra con CD 11 o essere [ACCECATA] per 1 round. CD = 10 + 0 (½×1) + 0 (Car 10)."}],"ca":11,"contatto":10,"impreparato":11,"pf":9,"dv":1,"ts":{"Tempra":2,"Riflessi":3,"Volontà":0},"velocita":"9 m, Nuotare 3 m, Scalare 3 m","attacchi":["Sciame 1d4"],"att_speciali":"Brulicare CD 11 ([ACCECATO] 1 round)","car":{"For":4,"Des":10,"Cos":null,"Int":2,"Sag":10,"Car":10},"bmc":"BMC —, DMC —","talenti":"nessuno","abilita":"Furtività +8, Percezione +4"},{"id":"ectoplasma","nome":"Ectoplasma","livello":2,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Una bolla vischiosa di protoplasma etereo, fredda al tatto come la morte. Scivola attraverso le crepe dei muri e si insinua tra i nemici prima che possano accorgersi della sua presenza.","extra":["Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Amorfo","tipo":"Sfo","testo":"L'ectoplasma non ha forma definita e non subisce danni critici. Non è soggetto a manovre di Sbilanciare o Viaggio."},{"nome":"Fluttuare","tipo":"Sfo","testo":"L'ectoplasma può muoversi verticalmente senza costo aggiuntivo, mantenendo un'altezza massima di 1 m dal suolo."},{"nome":"Scatto in fase","tipo":"Sfo","testo":"Come azione veloce, l'ectoplasma può muoversi attraverso pareti o ostacoli solidi spessi fino a 1,5 m. Non provoca attacchi di opportunità."},{"nome":"Fumoso","tipo":"Sfo","testo":"50% di probabilità di fallimento contro attacchi fisici non magici. Non si applica agli attacchi magici o agli incantesimi."},{"nome":"Melma orripilante","tipo":"Sop","testo":"Chi viene colpito dallo schianto deve superare un TS su Volontà con CD 12 o essere [SCOSSO] per 1d4 round. Effetto [paura, influenza mentale]."}],"ca":15,"contatto":15,"impreparato":10,"pf":9,"dv":2,"ts":{"Tempra":0,"Riflessi":3,"Volontà":2},"velocita":"6 m","attacchi":["Schianto +3 a contatto (1d6+1 più Melma orripilante Vol CD 12)"],"att_speciali":"","car":{"For":null,"Des":16,"Cos":null,"Int":6,"Sag":10,"Car":12},"bmc":"BMC +3, DMC 13","talenti":"nessuno","abilita":"Furtività +7, Percezione +4"},{"id":"ghoul_comune","nome":"Ghoul comune","livello":2,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Dal ventre affamato e le dita adunche, il ghoul comune è animato da un istinto divorante. Il suo tocco provoca nausea e disorientamento in chiunque sopravviva al primo contatto.","extra":["Capacità difensive: +4 vs scacciare/positiva"],"capacita":[{"nome":"Tocco nauseante","tipo":"Sop","testo":"Chi viene colpito da morso o artiglio deve superare un TS su Tempra con CD 13 o essere [FRASTORNATO] per 1d4+1 round. CD = 10 + 1 (½ DV) + 2 (Car). Chi supera il tiro è immune per 24 ore allo stesso ghoul."}],"ca":14,"contatto":12,"impreparato":12,"pf":13,"dv":2,"ts":{"Tempra":0,"Riflessi":2,"Volontà":5},"velocita":"9 m","attacchi":["Morso +2 (1d6+1 più Tocco nauseante) e 2 Artigli +2 (1d4+1 più Tocco nauseante)"],"att_speciali":"","car":{"For":13,"Des":15,"Cos":null,"Int":13,"Sag":14,"Car":14},"bmc":"BMC +3, DMC 15","talenti":"nessuno","abilita":"Furtività +7, Percezione +7, Scalare +6"},{"id":"mezzo_ghoul_servitore","nome":"Mezzo-ghoul servitore","livello":2,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":true,"nota":"","iniziativa":1,"descr":"A metà tra il vivo e il morto, questo servitore maledetto mantiene abbastanza intelletto da obbedire a ordini complessi. Il necrarca lo utilizza come agente discreto, messaggero o maggiordomo.","extra":[],"capacita":[{"nome":"Focus semplice","tipo":"Sop","testo":"Non conta nel limite di 3 non morti controllabili mentre è sotto forma di parte focale. Un solo Focus semplice attivo alla volta."},{"nome":"Maggiordomo","tipo":"Sop","testo":"Può sbrigare compiti complessi (scrivere, cucinare, portare messaggi, sorvegliare) come un servitore competente. Le doti di Dominio dei Ghoul che richiedono il combattimento attivo (Dominio dei Ghoul II e IV) non si applicano a questa creatura."}],"ca":12,"contatto":12,"impreparato":10,"pf":9,"dv":2,"ts":{"Tempra":2,"Riflessi":2,"Volontà":5},"velocita":"9 m","attacchi":["Artiglio +0 (1d2)"],"att_speciali":"","car":{"For":10,"Des":12,"Cos":null,"Int":13,"Sag":10,"Car":14},"bmc":"BMC +0, DMC 11","talenti":"nessuno","abilita":"Conoscenze (gen.) +6, Percezione +7, Furtività +6, Raggirare +4"},{"id":"zombie","nome":"Zombie","livello":2,"tipo":"Zombie","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Il classico non morto: lento, instancabile, capace di assorbire punizioni che abbatterebbero qualsiasi essere vivente. Avanza senza pensare, senza fermarsi, senza smettere.","extra":["RD 1/tagliente"],"capacita":[{"nome":"Barcollante","tipo":"Sfo","testo":"Ha sempre la condizione [BARCOLLANTE] ma può effettuare cariche muovendosi alla propria velocità base."}],"ca":13,"contatto":12,"impreparato":12,"pf":9,"dv":2,"ts":{"Tempra":2,"Riflessi":0,"Volontà":2},"velocita":"9 m","attacchi":["Schianto +4 (1d6+3)"],"att_speciali":"Barcollante","car":{"For":17,"Des":10,"Cos":null,"Int":2,"Sag":10,"Car":12},"bmc":"BMC +4, DMC 14","talenti":"nessuno","abilita":"nessuna"},{"id":"zucca_maligna","nome":"Zucca maligna","livello":2,"tipo":"Spirito","taglia":"minuscolo","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Una testa animata dalla magia necromantica, con occhi incandescenti e un sorriso pieno di denti aguzzi. Vola radente al suolo sputando fiamme e scrutando l'invisibile con la sua luce spettrale.","extra":["Immunità: Fuoco","Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Fumoso","tipo":"Sfo","testo":"Come Ectoplasma: 50% di probabilità di fallimento contro attacchi fisici non magici."},{"nome":"Vedere invisibilità","tipo":"Sop","testo":"1/giorno, come azione standard: la zucca attiva la capacità di vedere creature e oggetti invisibili per 1 minuto."},{"nome":"Bagliore","tipo":"Sop","testo":"Come azione standard, la zucca emette una luce spettrale che illumina un'area di 6 m. La durata e il colore sono a discrezione del necrarca (massimo 1 ora)."},{"nome":"Sputo infuocato","tipo":"Sop","testo":"Attacco a distanza, gittata 9 m (incremento 3 m), 1d6 danni da fuoco. La zucca è immune al fuoco."}],"ca":12,"contatto":12,"impreparato":10,"pf":8,"dv":2,"ts":{"Tempra":0,"Riflessi":2,"Volontà":3},"velocita":"6 m","attacchi":["Schianto +1 (1d4)","Distanza: Sputo infuocato +3 a contatto (1d6 fuoco, gittata 9 m)"],"att_speciali":"","car":{"For":8,"Des":14,"Cos":null,"Int":8,"Sag":12,"Car":12},"bmc":"BMC +0, DMC 10","talenti":"nessuno","abilita":"Percezione +5, Furtività +6"},{"id":"mano_strisciante","nome":"Mano strisciante","livello":3,"tipo":"Disarticolato","taglia":"minuscolo","sciame":false,"focus":true,"nota":"","iniziativa":4,"descr":"Una mano mozza che striscia come un ragno, silenziosa e velocissima. Non c'è guardia abbastanza vigile da sentirla avvicinarsi, e nessuno dimentica la sensazione di quelle dita che si stringono intorno alla gola.","extra":[],"capacita":[{"nome":"Focus semplice","tipo":"Sop","testo":"Non conta nel limite di 3 non morti controllabili mentre è parte focale. Un solo Focus semplice attivo alla volta."},{"nome":"Strangolare","tipo":"Sfo","testo":"Se colpisce una creatura di taglia media o inferiore con lo schianto, può effettuare una manovra di Lottare come azione gratuita senza provocare attacchi di opportunità. Non subisce penalità di taglia a queste manovre contro creature di taglia media o inferiore. Se la manovra riesce, in ogni turno successivo infligge automaticamente 1d4+2 danni. L'avversario trattenuto non può parlare né lanciare incantesimi con componenti verbali."}],"ca":17,"contatto":14,"impreparato":12,"pf":11,"dv":2,"ts":{"Tempra":1,"Riflessi":4,"Volontà":2},"velocita":"6 m, Scalare 3 m","attacchi":["Schianto +4 (1d4+2 più Afferrare)"],"att_speciali":"Strangolare","car":{"For":15,"Des":19,"Cos":null,"Int":2,"Sag":12,"Car":10},"bmc":"BMC +3 (+5 Lottare), DMC 17","talenti":"Mobilità","abilita":"Furtività +16, Percezione +6, Scalare +12"},{"id":"festrog","nome":"Festrog","livello":3,"tipo":"Ghoul","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Questa creatura deforme, metà umana e metà bestia, corre a quattro zampe con una velocità inquietante. Le sue pustole infette scoppiano al contatto e la sua frenesia in carica abbatte anche chi regge i suoi artigli.","extra":[],"capacita":[{"nome":"Pustole infette","tipo":"Sop","testo":"Quando il festrog colpisce in mischia, il bersaglio deve superare un TS su Tempra con CD 13 o essere [INFERMO] per 1d4 round. Effetto [veleno, malattia]."},{"nome":"Nutrirsi","tipo":"Sfo","testo":"Ogni volta che colpisce con il morso una creatura vivente dotata di carne, il festrog si cura di 1d4 Punti Ferita."},{"nome":"Sbilanciare in carica","tipo":"Sfo","testo":"Al termine di una carica, il festrog può effettuare una manovra di Sbilanciare come azione gratuita con BMC +7."}],"ca":17,"contatto":13,"impreparato":13,"pf":17,"dv":3,"ts":{"Tempra":0,"Riflessi":4,"Volontà":4},"velocita":"9 m (12 m su 4 zampe)","attacchi":["2 Artigli +4 (1d4+2) e Morso +3 (1d3+1 più Nutrirsi 1d4 PF)"],"att_speciali":"Pustole infette CD 13, Sbilanciare in carica","car":{"For":15,"Des":17,"Cos":null,"Int":2,"Sag":14,"Car":12},"bmc":"BMC +5 (+7 Sbil.), DMC 18","talenti":"Inseguire","abilita":"Acrobazia +7, Percezione +8, Scalare +7"},{"id":"mastino_etereo","nome":"Mastino etereo","livello":3,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":1,"descr":"Un cane spettrale che esiste a metà tra il mondo materiale e quello etereo. I suoi morsi trapassano armature e scudi come se non esistessero, e il suo fiuto soprannaturale lo guida direttamente agli altri non morti.","extra":["Capacità difensive: sfasatura eterea (20% mancato)"],"capacita":[{"nome":"Sfasatura eterea","tipo":"Sfo","testo":"Parzialmente nel Piano Etereo: 20% probabilità di fallimento contro tutti gli attacchi fisici."},{"nome":"Fauci eteree","tipo":"Sop","testo":"Gli attacchi di morso sono trattati come Tocco fantasma: ignorano il bonus di armatura e naturale, colpiscono le creature incorporee."},{"nome":"Fiutare non morti","tipo":"Sfo","testo":"Individua automaticamente i non morti entro 30 m (90 m controvento), anche attraverso materiali solidi."},{"nome":"","tipo":"","testo":"Capacità magiche (LI 3°, Concentrazione +4): 1/giorno — Suono fantasma (Vol CD 12), Immagine silenziosa (Vol CD 12), Foschia occultante"}],"ca":14,"contatto":13,"impreparato":11,"pf":17,"dv":3,"ts":{"Tempra":0,"Riflessi":1,"Volontà":4},"velocita":"12 m","attacchi":["Morso +5 (1d6+3 più Sbilanciare)"],"att_speciali":"Fauci eteree","car":{"For":16,"Des":13,"Cos":null,"Int":5,"Sag":14,"Car":12},"bmc":"BMC +4 (+6 Sbil.), DMC 15","talenti":"nessuno","abilita":"Percezione +8, Furtività +5, Fiutare +12"},{"id":"zombie_rapido","nome":"Zombie rapido","livello":3,"tipo":"Zombie","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Non c'è niente di lento in questo zombie. Strappa e colpisce con una furia caotica che sembra quasi vitalità, scaraventando i nemici a terra prima che abbiano il tempo di reagire.","extra":["RD 1/tagliente"],"capacita":[{"nome":"Barcollante","tipo":"Sfo","testo":"Ha sempre la condizione [BARCOLLANTE] ma può effettuare cariche."},{"nome":"Colpi rapidi","tipo":"Sfo","testo":"Quando effettua un attacco completo, lo zombie rapido sferza un secondo schianto al suo bonus di attacco massimo (+5). Entrambi i colpi si risolvono nella stessa azione."}],"ca":15,"contatto":14,"impreparato":12,"pf":17,"dv":3,"ts":{"Tempra":0,"Riflessi":2,"Volontà":3},"velocita":"9 m","attacchi":["Schianto +5 (1d6+3)"],"att_speciali":"Colpi rapidi, Barcollante","car":{"For":17,"Des":14,"Cos":null,"Int":2,"Sag":10,"Car":12},"bmc":"BMC +6, DMC 16","talenti":"nessuno","abilita":"nessuna"},{"id":"decapitato","nome":"Decapitato","livello":4,"tipo":"Disarticolato","taglia":"minuscolo","sciame":false,"focus":true,"nota":"","iniziativa":5,"descr":"Una testa spiccata dal collo che volteggia nell'aria a pochi centimetri dal suolo, osservando tutto con occhi vuoti. Il suo urlo soprannaturale taglia il coraggio come una lama.","extra":[],"capacita":[{"nome":"Focus semplice","tipo":"Sop","testo":"Non conta nel limite di 3 non morti controllabili mentre è parte focale. Un solo Focus semplice attivo alla volta."},{"nome":"Sensore visivo","tipo":"Sop","testo":"Come azione di round completo, il necrarca può scegliere di vedere attraverso gli occhi del decapitato (portata massima 30 m dal necrarca). Ottiene anche la scurovisione del decapitato per tutta la durata. Può terminare l'effetto come azione gratuita."},{"nome":"Urlo straziante","tipo":"Sop","testo":"1/1d4 round, come azione gratuita: tutte le creature entro 6 m devono superare un TS su Volontà con CD 12 o essere [SCOSSE] per 1d3+1 round. Le creature che superano il tiro sono immuni per 24 ore. Effetto [uditivo, paura, influenza mentale]."}],"ca":17,"contatto":15,"impreparato":12,"pf":17,"dv":3,"ts":{"Tempra":0,"Riflessi":2,"Volontà":2},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Morso +4 (1d4)"],"att_speciali":"Urlo straziante","car":{"For":11,"Des":20,"Cos":null,"Int":6,"Sag":11,"Car":10},"bmc":"BMC +0, DMC 10 (non sbilanciato)","talenti":"Mobilità","abilita":"Furtività +17, Percezione +8"},{"id":"isitoq","nome":"Isitoq","livello":4,"tipo":"Disarticolato","taglia":"minuscolo","sciame":false,"focus":true,"nota":"","iniziativa":5,"descr":"Un globo oculare disincarnato che fluttua silenzioso nell'ombra. Niente sfugge alla sua visione, e le lacrime spettrali che distilla disorientano chi osa incontrarne lo sguardo.","extra":[],"capacita":[{"nome":"Focus semplice","tipo":"Sop","testo":"Come Decapitato."},{"nome":"Sensore visivo","tipo":"Sop","testo":"Come Decapitato. Vista telescopica: può percepire dettagli a 300 m come se fossero a 9 m."},{"nome":"Lacrime di angoscia","tipo":"Sop","testo":"Come azione di round completo, l'isitoq può bersagliare una creatura entro 9 m con un attacco a contatto a distanza. Se colpisce, il bersaglio deve superare un TS su Volontà con CD 12 o essere [FRASTORNATO] per 1 round. Effetto [compulsione, paura, influenza mentale]."}],"ca":17,"contatto":15,"impreparato":12,"pf":17,"dv":3,"ts":{"Tempra":0,"Riflessi":2,"Volontà":2},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Nessun attacco in mischia"],"att_speciali":"Lacrime di angoscia","car":{"For":11,"Des":20,"Cos":null,"Int":6,"Sag":11,"Car":10},"bmc":"BMC +0, DMC 10 (non sbilanciato)","talenti":"Mobilità","abilita":"Furtività +17, Percezione +8"},{"id":"armatura_fantasma","nome":"Armatura fantasma","livello":4,"tipo":"Spirito","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Un'armatura vuota che si muove da sola, silenziosa come un fantasma. Ferma contro una parete è indistinguibile da un equipaggiamento abbandonato — finché non è troppo tardi.","extra":["Capacità difensive: +4 vs scacciare/positiva"],"capacita":[{"nome":"Immobilità","tipo":"Sfo","testo":"Se l'armatura fantasma rimane ferma per almeno 1 round, ottiene automaticamente 20 sulla prova di Furtività, sembrando del tutto identica a un'armatura normale abbandonata. Qualsiasi movimento interrompe l'effetto."},{"nome":"Equipaggiamento","tipo":"Sfo","testo":"Vedi regola generale Equipaggiamento (Sezione regole). L'armatura fantasma può usare qualsiasi arma da mischia senza la qualità \"Difficile da usare\"."}],"ca":19,"contatto":10,"impreparato":19,"pf":22,"dv":4,"ts":{"Tempra":1,"Riflessi":2,"Volontà":3},"velocita":"9 m","attacchi":["2 Schianti +5 (1d6+3)"],"att_speciali":"","car":{"For":17,"Des":11,"Cos":null,"Int":6,"Sag":11,"Car":10},"bmc":"BMC +4, DMC 16","talenti":"Attacco poderoso","abilita":"Furtività +12"},{"id":"ghoul_assassino","nome":"Ghoul assassino","livello":4,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Agile e predatorio, questo ghoul ha conservato gli istinti del cacciatore che era in vita. Si muove nell'ombra e colpisce con precisione chirurgica, sfruttando ogni minimo abbassamento della guardia del bersaglio.","extra":[],"capacita":[{"nome":"Attacco furtivo","tipo":"Sfo","testo":"Se il ghoul assassino colpisce un nemico [COLTO ALLA SPROVVISTA] o uno che gli stia fiancheggiando, infligge 1d6 danni aggiuntivi."},{"nome":"Eludere","tipo":"Sfo","testo":"Se il ghoul assassino supera un Tiro Salvezza su Riflessi contro un effetto che infligge metà danno in caso di successo, non subisce alcun danno."}],"ca":17,"contatto":15,"impreparato":11,"pf":22,"dv":4,"ts":{"Tempra":0,"Riflessi":7,"Volontà":1},"velocita":"9 m","attacchi":["2 Artigli +5 (1d6+3 / 19-20)"],"att_speciali":"Attacco furtivo +1d6, Eludere","car":{"For":17,"Des":19,"Cos":null,"Int":4,"Sag":13,"Car":10},"bmc":"BMC +5, DMC 19","talenti":"Critico migliorato (artiglio)","abilita":"Acrobazia +8, Furtività +8, Nuotare +8, Percezione +6, Rapidità di mano +9, Scalare +16"},{"id":"scheletro_guerriero","nome":"Scheletro guerriero","livello":4,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":1,"descr":"Più che uno scheletro, un soldato eterno. Le sue ossa conservano la memoria muscolare di decenni di combattimento, e la sua tecnica è ancora letale quanto lo era da vivo.","extra":["Immunità: Freddo"],"capacita":[{"nome":"Equipaggiamento","tipo":"Sfo","testo":"Vedi regola generale Equipaggiamento (Sezione regole)."}],"ca":18,"contatto":11,"impreparato":14,"pf":22,"dv":4,"ts":{"Tempra":3,"Riflessi":1,"Volontà":3},"velocita":"9 m","attacchi":["2 Artigli +4 (1d4+3) oppure Arma impugnata +6"],"att_speciali":"","car":{"For":15,"Des":13,"Cos":null,"Int":4,"Sag":10,"Car":12},"bmc":"BMC +5, DMC 16","talenti":"Attacco poderoso, Incalzare","abilita":"nessuna"},{"id":"scheletro_tiratore","nome":"Scheletro tiratore","livello":4,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Un arciere scheletrico dalla mira infallibile. Non conosce nervosismo, non perde la concentrazione, non trema. Scatta freccia dopo freccia con ritmo meccanico e devastante.","extra":["Immunità: Freddo"],"capacita":[{"nome":"Equipaggiamento","tipo":"Sfo","testo":"Vedi regola generale Equipaggiamento (Sezione regole). Uno scheletro tiratore appena evocato è dotato di un arco corto (gittata 18 m, 1d6+1) o un arco lungo (gittata 21 m, 1d8+1), a scelta del necrarca. Le frecce sono generate dalla magia (illimitate) finché l'arco fa parte del corpo del non morto."}],"ca":16,"contatto":13,"impreparato":12,"pf":22,"dv":4,"ts":{"Tempra":3,"Riflessi":3,"Volontà":3},"velocita":"9 m","attacchi":["2 Artigli +2 (1d4+1)","Distanza: Arco +6 (1d6+1 o 1d8+1, gittata 18/21 m)"],"att_speciali":"","car":{"For":13,"Des":17,"Cos":null,"Int":4,"Sag":10,"Car":12},"bmc":"BMC +3, DMC 16","talenti":"Tiro ravvicinato, Tiro preciso","abilita":"Percezione +4"},{"id":"allip","nome":"Allip","livello":5,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":1,"descr":"Il fantasma di chi è morto di follia, ancora intrappolato nel proprio delirio eterno. Il suo balbettio incessante contamina la mente di chi si avvicina, trascinandolo in un vortice di allucinazioni.","extra":["Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Fumoso","tipo":"Sfo","testo":"Come Ectoplasma: 50% probabilità di fallimento contro attacchi fisici non magici."},{"nome":"Balbettio","tipo":"Sop","testo":"Ogni creatura entro 3 m all'inizio del proprio turno deve superare un TS su Volontà con CD 15 o essere [AFFASCINATA] per 2d4 round (fissa l'allip e non può agire). CD = 10 + 1 (½ DV) + 2 (Car +2) + 2 bonus. Effetto [influenza mentale, compulsione]. Chi supera il TS è immune all'aura di questo allip per 24 ore."},{"nome":"Follia","tipo":"Sop","testo":"Se l'allip infligge un colpo critico col tocco incorporeo, il bersaglio subisce 1d4 danni di Saggezza e l'allip si cura di 5 PF temporanei."}],"ca":17,"contatto":14,"impreparato":13,"pf":17,"dv":3,"ts":{"Tempra":4,"Riflessi":4,"Volontà":4},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Tocco incorporeo +5 a contatto (1d6+2 energia negativa + Follia)","Aura: Balbettio (3 m, Vol CD 15)"],"att_speciali":"","car":{"For":null,"Des":12,"Cos":null,"Int":6,"Sag":11,"Car":15},"bmc":"BMC +4, DMC 17","talenti":"nessuno","abilita":"Furtività +7, Percezione +6"},{"id":"ombra","nome":"Ombra","livello":5,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Un'ombra che esiste indipendentemente da chi la proietta. Scivola tra la penombra, succhiando la forza vitale col suo tocco incorporeo e lasciando le vittime sempre più spossate ad ogni contatto.","extra":["Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Fumoso","tipo":"Sfo","testo":"Come Ectoplasma: 50% probabilità di fallimento contro attacchi fisici non magici."},{"nome":"Vera ombra","tipo":"Sfo","testo":"In condizioni di luce scarsa o oscurità, l'ombra ottiene +8 alle prove di Furtività quando è ferma o si muove lentamente (la metà della velocità)."},{"nome":"Tocco sfiancante","tipo":"Sop","testo":"Se l'ombra infligge un colpo critico col tocco incorporeo, il bersaglio diventa [AFFATICATO]. Se era già [AFFATICATO], diventa [ESAUSTO]."}],"ca":17,"contatto":15,"impreparato":13,"pf":17,"dv":3,"ts":{"Tempra":3,"Riflessi":3,"Volontà":4},"velocita":"12 m","attacchi":["Tocco incorporeo +5 a contatto (1d6+3 energia negativa + Tocco sfiancante)"],"att_speciali":"","car":{"For":null,"Des":14,"Cos":null,"Int":6,"Sag":12,"Car":16},"bmc":"BMC +4, DMC 17","talenti":"nessuno","abilita":"Furtività +10 (+18 in condizioni di scarsa illuminazione), Percezione +6"},{"id":"poltergeist","nome":"Poltergeist","livello":5,"tipo":"Spirito","taglia":"minuscolo","sciame":false,"focus":true,"nota":"","iniziativa":3,"descr":"Uno spirito che infesta oggetti e luoghi, spostando e scagliando cose con la mente incorporea. È impossibile da afferrare, difficile da scovare, e terrificante da fronteggiare in un ambiente chiuso.","extra":["Capacità difensive: +4 vs scacciare/positiva","Spazio: 75 cm"],"capacita":[{"nome":"","tipo":"","testo":"Capacità magiche (LI = livello del necrarca, Concentrazione = LI + 3):"},{"nome":"","tipo":"","testo":"A volontà — Mano magica; Telecinesi (solo Manovra in combattimento e Strattone violento)."},{"nome":"Focus semplice","tipo":"Sop","testo":"Non conta nel limite di 3 non morti controllabili mentre è parte focale. Un solo Focus semplice attivo alla volta."},{"nome":"Possessione","tipo":"Sop","testo":"Come azione standard, il poltergeist può entrare in un oggetto inanimato di taglia minuscola o inferiore entro 1,5 m, possedendolo. Non è visibile né bersagliabile finché è all'interno dell'oggetto. Può abbandonarlo come azione gratuita."},{"nome":"Immobilità","tipo":"Sfo","testo":"Se il poltergeist rimane fermo all'interno di un oggetto per almeno 1 round, l'oggetto sembra del tutto normale a qualsiasi ispezione non magica."}],"ca":19,"contatto":13,"impreparato":12,"pf":22,"dv":4,"ts":{"Tempra":5,"Riflessi":7,"Volontà":7},"velocita":"Volare 6 m (perfetta), altezza max 1 m","attacchi":["Nessun attacco diretto"],"att_speciali":"","car":{"For":6,"Des":17,"Cos":null,"Int":6,"Sag":14,"Car":17},"bmc":"BMC +6, DMC 14","talenti":"Attacco rapido","abilita":"Disattivare congegni +10, Furtività +24, Percezione +12 (+15 trovare trappole), Sapienza magica +10"},{"id":"decapitato_testa_di_medusa","nome":"Decapitato, Testa di medusa","livello":5,"tipo":"Disarticolato","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":1,"descr":"Una testa di medusa recisa che continua a calcificare chi la guarda troppo da vicino. Le sue spine si contorcono ancora, come se stesse ancora cercando una preda da pietrificare.","extra":[],"capacita":[{"nome":"Calcificazione","tipo":"Sop","testo":"Ogni creatura colpita dal morso deve superare un TS su Tempra con CD 15 o essere [FRASTORNATA] per 1d4 round mentre il proprio corpo tende a calcificarsi parzialmente. CD = 10 + 2 (½×5) + 2 (Car +2) + 1 bonus. Le creature immuni agli effetti di [veleno] sono immuni a questa capacità. Effetto [veleno]."}],"ca":19,"contatto":12,"impreparato":14,"pf":33,"dv":5,"ts":{"Tempra":3,"Riflessi":2,"Volontà":4},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Morso +7 (1d4+2 + Calcificazione)"],"att_speciali":"","car":{"For":14,"Des":12,"Cos":null,"Int":4,"Sag":11,"Car":15},"bmc":"BMC +4, DMC 15 (non sbilanciato)","talenti":"Attacco in volo","abilita":"Furtività +9, Percezione +8"},{"id":"zombie_bombardiere","nome":"Zombie bombardiere","livello":5,"tipo":"Zombie","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Il corpo gonfiato di questo zombie pulsa di energia oscura, come una pentola a pressione sul punto di esplodere. Il necrarca lo usa come un'arma usa e getta: lanciarlo contro i nemici e detonarlo al momento giusto.","extra":["RD 1/tagliente"],"capacita":[{"nome":"Barcollante","tipo":"Sfo","testo":"Ha sempre la condizione [BARCOLLANTE] ma può effettuare cariche muovendosi alla propria velocità base."},{"nome":"Detonazione necrotica","tipo":"Sop","testo":"Quando lo zombie bombardiere viene ridotto a 0 Punti Ferita, all'inizio del round successivo esplode in un raggio di 3 m, infliggendo 3d6 danni da energia negativa a tutte le creature nell'area (cura i non morti). Le vittime possono superare un TS su Riflessi con CD 14 per dimezzare. Il necrarca può anche far esplodere lo zombie volontariamente come azione standard, a patto che lo zombie sia entro 18 m e visibile. CD = 10 + 2 (½×4) + 1 (Car +1) + 1 bonus."}],"ca":13,"contatto":9,"impreparato":13,"pf":30,"dv":4,"ts":{"Tempra":1,"Riflessi":0,"Volontà":6},"velocita":"9 m","attacchi":["Schianto +5 (1d6+3)"],"att_speciali":"Detonazione necrotica, Barcollante","car":{"For":16,"Des":10,"Cos":null,"Int":2,"Sag":10,"Car":12},"bmc":"BMC +6, DMC 16","talenti":"Robustezza, Volontà di ferro","abilita":"nessuna"},{"id":"bocca_strisciante","nome":"Bocca strisciante","livello":6,"tipo":"Disarticolato","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Una mascella spalancata e dentata che striscia per terra come un mollusco carnivoro. Silenziosa, veloce e affamata, ingoia i nemici più piccoli senza preavviso, digerendo dall'interno ciò che ha catturato.","extra":[],"capacita":[{"nome":"Inghiottire","tipo":"Sop","testo":"Quando la bocca strisciante colpisce con il morso una creatura di taglia piccola o inferiore, può tentare di inghiottirla come azione gratuita (manovra di Lottare a BMC +10). Una creatura inghiottita subisce automaticamente 1d8+4 danni perforanti e 1d4 di sanguinamento all'inizio di ogni proprio turno. Può attaccare la bocca dall'interno (CA effettiva 13, 12 PF interni) o liberarsi con una prova di Lottare contrapposta come azione standard."},{"nome":"Sanguinamento","tipo":"Sop","testo":"Ogni morso infligge sanguinamento 1d4. Il sanguinamento può essere fermato con una prova di Guarire con CD 15 o qualsiasi effetto di cura magica."}],"ca":18,"contatto":14,"impreparato":15,"pf":32,"dv":5,"ts":{"Tempra":1,"Riflessi":4,"Volontà":4},"velocita":"6 m, Scalare 3 m","attacchi":["Morso +8 (1d8+4 più Inghiottire e Sanguinamento 1d4)"],"att_speciali":"","car":{"For":16,"Des":17,"Cos":null,"Int":4,"Sag":12,"Car":13},"bmc":"BMC +6, DMC 19","talenti":"Attacco rapido","abilita":"Furtività +11, Percezione +9"},{"id":"grottesco","nome":"Grottesco","livello":6,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Una figura umanoide deforme e gonfia, con andatura barcollante e voce gutturale che risuona come un rantolo. Non è veloce — ma non si ferma mai, e il suo borbottio malsano spezza il coraggio dei più forti.","extra":[],"capacita":[{"nome":"Scatto improvviso","tipo":"Sfo","testo":"1/minuto, come azione veloce: la velocità del grottesco aumenta a 12 m per 1 round."},{"nome":"Lento ma determinato","tipo":"Sfo","testo":"Il grottesco ignora le penalità al movimento causate da terreno difficile."},{"nome":"Borbottio","tipo":"Sop","testo":"1/giorno, come azione standard: tutte le creature entro 9 m che possono sentirlo devono superare un TS su Volontà con CD 17 o essere [SCOSSE] per 1 minuto. CD = 10 + 3 (½×6) + 4 (Car +4). Effetto [uditivo, paura, influenza mentale]."},{"nome":"Dolore","tipo":"Sop","testo":"Ogni creatura colpita da un attacco del grottesco deve superare un TS su Tempra con CD 17 o essere [BARCOLLANTE] per 1 round. Le creature a contatto col terreno subiscono penalità −1 al tiro. CD = 10 + 3 + 4 (Car +4). Effetto [dolore]."}],"ca":19,"contatto":8,"impreparato":15,"pf":39,"dv":6,"ts":{"Tempra":3,"Riflessi":0,"Volontà":5},"velocita":"6 m, Scalare 3 m, Scavare 3 m","attacchi":["Morso +6 (1d4+2 + Dolore) e 2 Artigli +6 (1d4+2 + Dolore)"],"att_speciali":"Borbottio CD 17, Scatto improvviso","car":{"For":15,"Des":10,"Cos":null,"Int":4,"Sag":14,"Car":19},"bmc":"BMC +4, DMC 12","talenti":"Inseguire","abilita":"Furtività +6, Percezione +8, Scalare +10"},{"id":"statua_posseduta","nome":"Statua posseduta","livello":6,"tipo":"Spirito","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Un colosso di pietra o metallo animato da uno spirito ostile. Può stare immobile per ore — identico a una statua decorativa — prima di muoversi con una forza capace di abbattere muri.","extra":["Capacità difensive: +4 vs scacciare/positiva","Spazio 3 m, Portata 3 m"],"capacita":[{"nome":"Immobilità","tipo":"Sfo","testo":"Se la statua posseduta rimane ferma per almeno 1 round, ottiene automaticamente 20 sulla prova di Furtività, sembrando del tutto identica a una statua inanimata. Qualsiasi movimento interrompe l'effetto."}],"ca":20,"contatto":10,"impreparato":20,"pf":39,"dv":6,"ts":{"Tempra":1,"Riflessi":2,"Volontà":3},"velocita":"6 m","attacchi":["Schianto possente +9 (2d8+7 / 19-20)"],"att_speciali":"","car":{"For":20,"Des":11,"Cos":null,"Int":6,"Sag":11,"Car":15},"bmc":"BMC +12, DMC 22","talenti":"Attacco poderoso","abilita":"Furtività +4"},{"id":"vukodlak","nome":"Vukodlak","livello":6,"tipo":"Zombie","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Un non morto dalla natura lupesca, rapido come un predatore e duro come un mostro. Il suo sguardo terrificante paralizza la preda un istante prima che le zanne raggiungano la gola.","extra":["RD 3/Argento","Resistenze: Elettricità 5, Freddo 5","Spazio 3 m, Portata 1,5 m"],"capacita":[{"nome":"Aura innaturale","tipo":"Sfo","testo":"Gli animali a sangue caldo che si avvicinano entro 9 m sono automaticamente [SPAVENTATI] e non possono avvicinarsi ulteriormente, a meno che non superino un TS su Volontà con CD 15."},{"nome":"Sguardo terrificante","tipo":"Sop","testo":"Come azione veloce, gittata 9 m: il bersaglio deve superare un TS su Volontà con CD 14 o essere [FRASTORNATO] per 1 round. Effetto [paura, influenza mentale]."},{"nome":"Risucchio di sangue","tipo":"Sop","testo":"Ad ogni inizio del proprio turno in cui il vukodlak trattiene un avversario con una manovra di Lottare, il bersaglio subisce 1 danno di Costituzione."}],"ca":19,"contatto":11,"impreparato":13,"pf":39,"dv":6,"ts":{"Tempra":3,"Riflessi":3,"Volontà":5},"velocita":"15 m","attacchi":["Morso +8 (1d8+7 + Sbilanciare) e 2 Artigli +6 (1d8+5)","Aura: Aura innaturale (9 m)"],"att_speciali":"Sguardo terrificante, Risucchio di sangue","car":{"For":21,"Des":15,"Cos":null,"Int":6,"Sag":12,"Car":10},"bmc":"BMC +9 (+13 Lottare), DMC 21 (+25 vs Sbil.)","talenti":"Correre","abilita":"Percezione +10, Scalare +9"},{"id":"ardente_assiderato_disciolto_folgorato","nome":"Ardente / Assiderato / Disciolto / Folgorato","livello":7,"tipo":"Scheletro","taglia":"medio","sciame":false,"focus":false,"nota":"scegliere una variante all'evocazione","iniziativa":1,"descr":"Uno scheletro che ha assorbito l'energia elementale della sua morte violenta. Fuoco, freddo, acido o fulmine lo permeano dalla testa ai piedi — il semplice contatto brucia, congela, corrode o fulmina chiunque non sia abbastanza cauto.","extra":["Immunità: elemento scelto","Vulnerabilità: elemento opposto","Aure: Puzza di morte + Visioni di morte (3 m)"],"capacita":[{"nome":"","tipo":"","testo":"Varianti: Ardente (Fuoco, vulnerabile al Freddo) | Assiderato (Freddo, vulnerabile al Fuoco) | Disciolto (Acido, vulnerabile all'Elettricità) | Folgorato (Elettricità, vulnerabile all'Acido)."},{"nome":"Puzza di morte","tipo":"Sop","testo":"Aura continua di 3 m. Ogni creatura che inizia il proprio turno nell'aura deve superare un TS su Tempra con CD 15 o essere [INFERMA] per 1 minuto. Effetto [veleno]. CD = 10 + 3 (½×7) + 1 (Car +1) + 1 bonus."},{"nome":"Visioni di morte","tipo":"Sop","testo":"Aura continua di 3 m. Ogni creatura che inizia il proprio turno nell'aura deve superare un TS su Volontà con CD 14 o essere [STORDITA] per 1 round. Effetto [influenza mentale]."},{"nome":"Maledizione elementale","tipo":"Sop","testo":"Chi subisce il danno dell'elemento dallo schianto deve superare un TS su Tempra con CD 16 o subire 2d6 danni dello stesso elemento all'inizio di ogni proprio turno per 1d4 round (ignora qualsiasi Resistenza all'energia). CD = 10 + 3 + 1 (Car +1) + 2 bonus."},{"nome":"","tipo":"","testo":"Deflagrazione (Sim): A volontà, azione standard: attacco a contatto a distanza (gittata 9 m). Se colpisce, infligge 3d6 danni dell'elemento scelto. Non provoca attacchi di opportunità."}],"ca":20,"contatto":14,"impreparato":15,"pf":46,"dv":7,"ts":{"Tempra":2,"Riflessi":4,"Volontà":5},"velocita":"9 m","attacchi":["Schianto +6 (1d6+3 + 1d6 elemento + Maledizione elementale)","Distanza: Deflagrazione +6 a contatto (3d6 elemento, gittata 9 m, a volontà)"],"att_speciali":"","car":{"For":17,"Des":13,"Cos":null,"Int":4,"Sag":12,"Car":13},"bmc":"BMC +6, DMC 17","talenti":"nessuno","abilita":"Percezione +6"},{"id":"libro_della_dannazione","nome":"Libro della dannazione","livello":7,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Un tomo vivente, fluttuante e dentato, che lancia incantesimi di morte mentre volteggia nell'aria. Le sue pagine vibrano di magia oscura, e il suo morso sottrae vitalità a chi osa avvicinarsi troppo.","extra":["Debolezze: Vulnerabilità al Fuoco","Capacità difensive: +4 vs scacciare/positiva"],"capacita":[{"nome":"","tipo":"","testo":"Incantesimi (LI 5°, Concentrazione +10, Car +6):"},{"nome":"","tipo":"","testo":"2° livello (3/g) — Vita falsata, Raggio rovente, Sfocatura."},{"nome":"","tipo":"","testo":"1° livello (4/g, CD 17) — Dardo incantato, Incuti paura, Pasticcio."},{"nome":"","tipo":"","testo":"0° livello (5/g, CD 16) — Individuazione del magico*, Raggio di gelo, Mano magica, Ristorare cadavere, Suono fantasma."},{"nome":"Risucchio di energia","tipo":"Sop","testo":"Ogni morso infligge 1 livello negativo al bersaglio vivente (solo su creature viventi; i non morti sono immuni). Con un colpo critico, i livelli negativi inflitti sono 2."}],"ca":20,"contatto":18,"impreparato":15,"pf":46,"dv":7,"ts":{"Tempra":3,"Riflessi":4,"Volontà":7},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Morso +7 (1d3 + Risucchio di energia)"],"att_speciali":"","car":{"For":10,"Des":16,"Cos":null,"Int":7,"Sag":16,"Car":22},"bmc":"BMC +3, DMC 15","talenti":"Incantare in combattimento, Attacco in volo"},{"id":"zombie_della_rovina","nome":"Zombie della rovina","livello":7,"tipo":"Zombie","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Massiccio e implacabile, questo zombie è ricoperto di pustole piene di umore tossico che esplodono al contatto. Chi lo abbatte senza cautela si ritrova coperto di veleno, e chi sopravvive viene marchiato come prossima preda.","extra":["Spazio 1,5 m, Portata 1,5 m"],"capacita":[{"nome":"Esplosione di pus","tipo":"Sop","testo":"Ogni volta che una creatura colpisce lo zombie della rovina con un'arma tagliente o perforante senza la qualità Portata, deve superare un TS su Riflessi con CD 15 o subire 2d6 danni da energia negativa e diventare [NAUSEATA] per 1d3 round. CD = 10 + 3 (½×7) + 2 (Car +2)."},{"nome":"Marchio purulento","tipo":"Sfo","testo":"Ogni volta che lo zombie colpisce con l'artiglio un determinato bersaglio, ottiene +1 ai tiri per colpire, ai danni e alle prove di abilità contro quell'avversario per il resto dell'incontro. Questo bonus si applica solo all'ultimo bersaglio ferito."}],"ca":20,"contatto":13,"impreparato":16,"pf":46,"dv":7,"ts":{"Tempra":4,"Riflessi":6,"Volontà":6},"velocita":"9 m","attacchi":["Artiglio +11 (1d6+7 + Afferrare)"],"att_speciali":"Esplosione di pus CD 15, Marchio purulento","car":{"For":21,"Des":15,"Cos":null,"Int":6,"Sag":13,"Car":14},"bmc":"BMC +10 (+16 Lottare), DMC 23","talenti":"Attacco poderoso, Critico migliorato (artiglio), Lottare migliorato","abilita":"Percezione +7, Scalare +11"},{"id":"fucina_non_morta","nome":"Fucina non morta","livello":8,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Un fabbro condannato che continua a lavorare anche da morto, il corpo cosparso di metallo fuso e cicatrici da forgia. Il suo respiro incandescente acceca chi non si protegge, e la catena che porta attacca con vita propria.","extra":["Guarigione rapida 1","Immunità: Fuoco"],"capacita":[{"nome":"Corpo ardente","tipo":"Sop","testo":"Chiunque entra in lotta con la fucina non morta subisce 2d6 danni da fuoco. Chiunque rimane in lotta all'inizio del proprio turno subisce ulteriori 2d6 danni da fuoco."},{"nome":"Respiro incandescente","tipo":"Sop","testo":"Come azione standard: emette un cono di 9 m di scorie incandescenti. Ogni creatura nell'area deve superare un TS su Riflessi con CD 15 o subire 1d6 danni da fuoco ed essere [ACCECATA] per 1d4 round. CD = 10 + 4 (½×8) + 1 (Car +1)."},{"nome":"Catena dell'anima","tipo":"Sop","testo":"Una volta per round, come azione gratuita, la catena della fucina non morta attacca autonomamente un bersaglio entro 3 m con TxC +12 (1d6+7 + 1d6 fuoco). Conta come catena chiodata +1 Fiammeggiante."},{"nome":"","tipo":"","testo":"Speciale: I gradi di Professione (fabbro) della fucina non morta sono pari al livello del necrarca + 6."}],"ca":21,"contatto":10,"impreparato":16,"pf":52,"dv":8,"ts":{"Tempra":2,"Riflessi":2,"Volontà":7},"velocita":"9 m","attacchi":["Arma a una mano +9 (1d8+6) e Catena dell'anima +12 (2d4+7, Fiammeggiante, Portata 3 m)"],"att_speciali":"Corpo ardente, Respiro incandescente CD 15","car":{"For":18,"Des":10,"Cos":null,"Int":7,"Sag":14,"Car":12},"bmc":"BMC +7, DMC 15","talenti":"Abilità focalizzata (Professione: fabbro), Attacco poderoso","abilita":"Professione (fabbro) +X (vedi Speciale), Percezione +8"},{"id":"predatore_cinico","nome":"Predatore cinico","livello":8,"tipo":"Disarticolato","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Una creatura disarticolata che si muove nell'ombra, trascinandosi sul soffitto e lungo le pareti. Il suo artiglio lascia ferite che non smettono di sanguinare, e le sue capacità mentali possono cancellare ricordi e spegnere la volontà.","extra":["Sensi: Percezione cieca 9 m","Capacità difensive: +4 vs scacciare/positiva"],"capacita":[{"nome":"","tipo":"","testo":"Capacità magiche (LI 4°, Concentrazione +7):"},{"nome":"","tipo":"","testo":"5/giorno — Aprire/Chiudere, Immagine silenziosa (Vol CD 14), Suono fantasma (Vol CD 13)."},{"nome":"","tipo":"","testo":"3/giorno — Disperazione opprimente (Vol CD 16), Intralciare (Rifl CD 14), Svanire*, Vuoto di memoria (Vol CD 14)."},{"nome":"Lacerazione deprimente","tipo":"Sop","testo":"Ogni colpo dell'artiglio che ferisce il bersaglio attiva tre effetti: (1) Sanguinamento pari al danno dell'artiglio (1d6+6, fermato da Guarire CD 15 o magia); (2) il bersaglio deve superare un TS su Tempra con CD 15 o subire 1 livello negativo; (3) il bersaglio deve superare un TS su Volontà con CD 15 o essere [AFFATICATO] e non poter beneficiare di bonus morali per 1 minuto. Effetto [maledizione, morale, influenza mentale]."}],"ca":21,"contatto":16,"impreparato":14,"pf":60,"dv":8,"ts":{"Tempra":5,"Riflessi":6,"Volontà":8},"velocita":"9 m, Scalare 3 m","attacchi":["Artiglio +9 (1d6+6 / 19-20 + Lacerazione deprimente)"],"att_speciali":"","car":{"For":19,"Des":18,"Cos":null,"Int":7,"Sag":15,"Car":16},"bmc":"BMC +5, DMC 19 (+26 vs Sbil.)","talenti":"Combattere alla cieca, Critico migliorato (artiglio), Riflessi in combattimento, Robustezza","abilita":"Furtività +15, Percezione +14 (+17 trovare trappole), Scalare +16"},{"id":"ricucito","nome":"Ricucito","livello":9,"tipo":"Zombie","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":-1,"descr":"Un corpo ricucito con grossolane suture, fatto di pezzi di cadaveri diversi tenuti insieme da filo necromantico. Non muore facilmente — e quando sembra farlo, spesso si rialza.","extra":["Aura: Raccapricciante (18 m)","Capacità difensive: Destinato a vivere","Spazio 3 m, Portata 3 m"],"capacita":[{"nome":"Destinato a vivere","tipo":"Sfo","testo":"Il ricucito non subisce danni dall'energia positiva. Anziché danneggiarsi, ogni danno da energia positiva lo cura di metà dell'importo (arrotondato per difetto)."},{"nome":"Raccapricciante","tipo":"Sop","testo":"Ogni creatura entro 18 m che può vedere il ricucito deve superare un TS su Tempra con CD 17 o essere [NAUSEATA] per 1d4 round. CD = 10 + 4 (½×9) + 3 (Car +3). Chi supera il TS è immune per 24 ore."},{"nome":"Ricomporsi","tipo":"Sop","testo":"1/giorno, quando il ricucito viene ridotto a 0 PF, si rialza automaticamente all'inizio del round successivo con la metà dei propri PF massimi. Ogni creatura entro 6 m deve superare un TS su Volontà con CD 17 o essere [STORDITA] per 1 round. Questa capacità non funziona se il ricucito è stato ucciso da fuoco o dall'incantesimo Disintegrazione."}],"ca":21,"contatto":9,"impreparato":18,"pf":59,"dv":9,"ts":{"Tempra":5,"Riflessi":3,"Volontà":10},"velocita":"9 m","attacchi":["Morso +10 (1d4+5) e 2 Artigli +10 (1d4+5)"],"att_speciali":"Ricomporsi CD 17","car":{"For":21,"Des":8,"Cos":null,"Int":4,"Sag":17,"Car":16},"bmc":"BMC +10, DMC 19","talenti":"Attacco poderoso, Attacco rapido, Critico migliorato (artiglio), Volontà di ferro","abilita":"Percezione +13, Scalare +15"},{"id":"scuoiato","nome":"Scuoiato","livello":9,"tipo":"Disarticolato","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":0,"descr":"Una creatura orrificante che ha perso tutta la pelle, lasciando esposta una muscolatura scura e pulsante. Il solo guardarlo impone terrore, e il suo tocco sfibra il corpo come un veleno lento.","extra":["RD 5/−","Aura: Presenza terrificante (9 m)","Spazio 1,5 m, Portata 1,5 m"],"capacita":[{"nome":"Presenza terrificante","tipo":"Sop","testo":"Ogni creatura entro 9 m che può vedere lo scuoiato deve superare un TS su Volontà con CD 16 o essere [BARCOLLANTE] per 1d3 round. CD = 10 + 4 (½×9) + 2 (Car +2). Effetto [paura, influenza mentale]."},{"nome":"Tocco scuotipelle","tipo":"Sop","testo":"Ogni creatura colpita dallo schianto deve superare un TS su Tempra con CD 16 o essere [INFERMA] per 1 minuto. CD = 10 + 4 + 2 (Car +2)."}],"ca":21,"contatto":10,"impreparato":20,"pf":68,"dv":9,"ts":{"Tempra":4,"Riflessi":2,"Volontà":10},"velocita":"9 m","attacchi":["Schianto +14 (1d8+10 + Tocco scuotipelle Tempra CD 16)"],"att_speciali":"","car":{"For":24,"Des":10,"Cos":null,"Int":5,"Sag":15,"Car":15},"bmc":"BMC +13, DMC 23","talenti":"Attacco poderoso, Critico migliorato (schianto), Robustezza, Volontà di ferro","abilita":"Furtività +11, Percezione +16"},{"id":"spirito_vendicativo","nome":"Spirito vendicativo","livello":9,"tipo":"Spirito","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Un'anima incorporea consumata dall'odio verso un bersaglio designato dal necrarca. Il suo tocco lascia un marchio invisibile che insegue la vittima ovunque si nasconda, finché uno dei due è distrutto.","extra":["Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Fumoso","tipo":"Sfo","testo":"Come Ectoplasma: 50% probabilità di fallimento contro attacchi fisici non magici."},{"nome":"Marchio del rancore","tipo":"Sop","testo":"Quando lo spirito vendicativo colpisce una creatura vivente, questa deve superare un TS su Volontà con CD 17 o ricevere il Marchio del rancore. Una creatura marchiata subisce −2 a tutti i TS contro effetti di questo spirito, che conosce sempre la sua posizione (come Trova nemici permanente). Il marchio dura finché lo spirito non viene distrutto o dispelato con Rimuovi maledizione (CL 11°). Una creatura può avere il marchio di un solo spirito alla volta."},{"nome":"Caccia spettrale","tipo":"Sop","testo":"1/giorno: lo spirito sceglie una creatura marchiata entro 30 m. Per 1 minuto ottiene +4 ai tiri per colpire e ai danni contro di essa e la vede attraverso qualsiasi effetto di Furtività o Invisibilità."}],"ca":19,"contatto":16,"impreparato":14,"pf":45,"dv":7,"ts":{"Tempra":5,"Riflessi":5,"Volontà":7},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Tocco incorporeo +9 a contatto (4d6 energia negativa + Marchio del rancore)"],"att_speciali":"","car":{"For":null,"Des":18,"Cos":null,"Int":9,"Sag":13,"Car":18},"bmc":"BMC +7, DMC 21","talenti":"Attacco in volo, Mobilità, Volontà di ferro","abilita":"Furtività +14, Intimidire +14, Percezione +11"},{"id":"jagermeister","nome":"Jägermeister","livello":10,"tipo":"Spirito","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":6,"descr":"Il cacciatore eterno: uno spirito incorporeo dalla mira infallibile e dalla velocità fulminea. Chi lo affronta spesso non capisce da dove arriverà il prossimo attacco — e quando lo capisce, di solito è già troppo tardi.","extra":["Resistenze: Acido 10, Freddo 10","Aura: Aura innaturale (9 m)","Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Fumoso","tipo":"Sfo","testo":"Come Ectoplasma: 50% probabilità di fallimento contro attacchi fisici non magici."},{"nome":"Aura innaturale","tipo":"Sfo","testo":"Come Vukodlak: gli animali a sangue caldo si rifiutano di avvicinarsi entro 9 m (TS Vol CD 15 per resistere)."},{"nome":"Risucchio di Forza","tipo":"Sop","testo":"Ogni colpo che non sia un attacco mancato causa 1d3 danni a Forza alla creatura colpita (TS Tempra CD 18 dimezza). CD = 10 + 4 (½×8) + 4 (Car +4). Nota: questa capacità non funziona sui non morti, che sono immuni ai danni alle caratteristiche fisiche."},{"nome":"","tipo":"","testo":"Capacità magiche (LI 7°, Concentrazione +11):"},{"nome":"","tipo":"","testo":"1/giorno — Segugi spettrali (come Spada magica LI 7°: attacca a +11, 2d6+3 danni da forza, dura 1d4+3 round)."}],"ca":21,"contatto":21,"impreparato":15,"pf":52,"dv":8,"ts":{"Tempra":7,"Riflessi":11,"Volontà":8},"velocita":"Volare 12 m (perfetta), altezza max 1 m","attacchi":["Tocco incorporeo +12 (2d8 energia negativa + 1d3 Risucchio di Forza CD 18)"],"att_speciali":"","car":{"For":null,"Des":22,"Cos":null,"Int":7,"Sag":15,"Car":19},"bmc":"BMC +12, DMC 26","talenti":"Attacco in volo, Inseguire, Stoccata","abilita":"Furtività +17, Percezione +13"},{"id":"parassita_assassino","nome":"Parassita assassino","livello":10,"tipo":"Zombie","taglia":"grande","sciame":false,"focus":false,"nota":"","iniziativa":2,"descr":"Una massa enorme di carne parassitaria capace di strisciare attraverso fessure impossibili. La sua aura rende nauseanti anche i guerrieri più temprati, e il suo morso ha la forza di uno schianto di catapulta.","extra":["Aura: Infestazione (1,5 m)","Spazio 3 m, Portata 3 m"],"capacita":[{"nome":"Infestazione","tipo":"Sop","testo":"Ogni creatura che inizia il proprio turno entro 1,5 m dal parassita deve superare un TS su Tempra con CD 17 o essere [NAUSEATA] per 1 round e subire 1d6 danni. Se una creatura subisce 10 o più danni da un singolo attacco nell'area, l'aura è soppressa per 3 round. CD = 10 + 5 (½×10) + 2 (Car +2)."},{"nome":"Comprimersi","tipo":"Sfo","testo":"Il parassita assassino può muoversi attraverso spazi adatti a creature di taglia piccola senza penalità."},{"nome":"Ragnatela","tipo":"Sop","testo":"Attacco a contatto a distanza (gittata 15 m, incremento 3 m): 8/g. La creatura colpita è [INTRALCIATA] finché non supera una prova di Forza (CD 15) o Acrobazia (CD 15) come azione standard."}],"ca":21,"contatto":13,"impreparato":18,"pf":75,"dv":10,"ts":{"Tempra":5,"Riflessi":5,"Volontà":8},"velocita":"9 m, Scalare 6 m","attacchi":["Morso +15 (2d8+12)","Distanza: Ragnatela +9 a contatto (8/g, gittata 15 m)","Capacità speciali: Comprimersi"],"att_speciali":"","car":{"For":26,"Des":14,"Cos":null,"Int":6,"Sag":13,"Car":15},"bmc":"BMC +17, DMC 29 (+41 vs Sbil.)","talenti":"Attacco poderoso, Colpo terrificante, Robustezza, Spingere migliorato","abilita":"Furtività +16, Percezione +15, Scalare +16"},{"id":"revenant","nome":"Revenant","livello":10,"tipo":"Ghoul","taglia":"medio","sciame":false,"focus":false,"nota":"","iniziativa":3,"descr":"Un vendicatore non morto consacrato dal necrarca a un singolo bersaglio. Finché quel bersaglio vive, il revenant non si ferma — e se viene distrutto, basta raccogliere il teschio perché torni.","extra":["RI 17","Immunità: Freddo"],"capacita":[{"nome":"Grido funesto","tipo":"Sop","testo":"1/1d4 round, come azione gratuita: tutte le creature entro 9 m devono superare un TS su Volontà con CD 18 o essere [BARCOLLANTI] per 1d3 round. CD = 10 + 5 + 4 (Car +4) − 1. Effetto [paura, influenza mentale]."},{"nome":"Rancore","tipo":"Sop","testo":"Quando il necrarca evoca un revenant, sceglie una creatura vivente come bersaglio del Rancore (deve averla vista, conoscerne nome e descrizione, o possedere un suo oggetto personale). Il bersaglio non può essere cambiato dopo l'evocazione."},{"nome":"","tipo":"","testo":"Il revenant conosce sempre la direzione del bersaglio. Contro di esso gode dei benefici di Rivela bugie, Visione del vero (LI 20°) e Velocità (LI 20°) come effetti indissolubili, e ottiene +4 ai tiri per colpire, ai danni, alle prove di Lottare e ai Tiri Salvezza contro di esso."},{"nome":"","tipo":"","testo":"Finché il bersaglio è vivo, un revenant distrutto non si trasforma in polvere: il suo teschio può essere raccolto come parte focale e rianimato dopo 1d4 giorni. Quando il bersaglio muore, il revenant si trasforma in polvere immediatamente. Per distruggerlo permanentemente prima di allora: versare acqua santa sui resti."}],"ca":21,"contatto":14,"impreparato":17,"pf":65,"dv":10,"ts":{"Tempra":7,"Riflessi":6,"Volontà":7},"velocita":"9 m","attacchi":["2 Artigli +14 (1d8+7 + Afferrare + Stritolare 1d6+7)"],"att_speciali":"Grido funesto CD 18, Rancore","car":{"For":24,"Des":17,"Cos":null,"Int":7,"Sag":12,"Car":19},"bmc":"BMC +13 (+19 Lottare), DMC 26","talenti":"Attacco poderoso, Critico migliorato (artiglio), Incalzare, Lottare migliorato","abilita":"Intimidire +16, Percezione +13"},{"id":"fantasma","nome":"Fantasma","livello":11,"tipo":"Spirito","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":1,"descr":"Un'apparizione incorporea che porta con sé la follia e la morte. Il suo tocco corruttore dissolve la carne dall'interno, e il suo lamento può far perdere ogni controllo anche ai più coraggiosi.","extra":["Capacità difensive: fumoso, +4 vs scacciare/positiva"],"capacita":[{"nome":"Fumoso","tipo":"Sfo","testo":"Come Ectoplasma: 50% probabilità di fallimento contro attacchi fisici non magici."},{"nome":"Lamento terrificante","tipo":"Sop","testo":"1/1d4 round, come azione gratuita: tutte le creature entro 9 m devono superare un TS su Volontà con CD 18 o essere [IN PREDA AL PANICO] per 1d3 round. CD = 10 + 4 (½×9) + 5 (Car +5) − 1. Chi supera il TS è immune per 24 ore. Effetto [paura, influenza mentale]."}],"ca":21,"contatto":18,"impreparato":16,"pf":68,"dv":9,"ts":{"Tempra":7,"Riflessi":5,"Volontà":9},"velocita":"Volare 9 m (perfetta), altezza max 1 m","attacchi":["Tocco corruttore +6 a contatto (6d6, Tempra CD 18 dimezza)"],"att_speciali":"Lamento terrificante CD 18","car":{"For":null,"Des":12,"Cos":null,"Int":7,"Sag":11,"Car":20},"bmc":"BMC +5, DMC 22","talenti":"Attacco in volo, Mobilità, Robustezza, Volontà di ferro","abilita":"Conoscenze +10, Furtività +9, Intuizione +10, Percezione +18"},{"id":"sussurrante","nome":"Sussurrante","livello":11,"tipo":"Scheletro","taglia":"piccolo","sciame":false,"focus":false,"nota":"","iniziativa":4,"descr":"Un'entità che sussurra instancabilmente, rubando la voce a chi si avvicina e avvolgendo l'ambiente in un'aura di silenzio opprimente. Il mago senza voce è il mago più vulnerabile del mondo.","extra":["Aura: Snervante (3 m)"],"capacita":[{"nome":"Aura snervante","tipo":"Sop","testo":"Ogni creatura entro 3 m non può beneficiare di capacità uditive e subisce −1 ai tiri per colpire, ai danni e ai TS su Volontà. Effetto [uditivo, compulsione]."},{"nome":"Rubare respiro","tipo":"Sop","testo":"Morso: la creatura colpita deve superare un TS su Volontà con CD 18 o diventare [AFFATICATA] per 1 ora (se già affaticata, diventa [ESAUSTA] — se esausta dal sussurrante, cade in un sonno magico per 24 ore). CD = 10 + 5 (½×11) + 4 (Car +4) − 1."},{"nome":"Rubare voce","tipo":"Sop","testo":"Tocco a contatto: la creatura colpita deve superare un TS su Volontà con CD 18 o non poter parlare né lanciare incantesimi con componenti verbali per 1 ora. Il sussurrante può imitare perfettamente la voce rubata per la durata dell'effetto."}],"ca":22,"contatto":17,"impreparato":15,"pf":72,"dv":11,"ts":{"Tempra":5,"Riflessi":6,"Volontà":10},"velocita":"6 m","attacchi":["Morso +9 (1d4−1 + Rubare respiro Vol CD 18)","Tocco +4 a contatto (Rubare voce Vol CD 18)"],"att_speciali":"","car":{"For":9,"Des":19,"Cos":null,"Int":7,"Sag":16,"Car":18},"bmc":"BMC +2, DMC 17","talenti":"Arma accurata, Mobilità, Riflessi in combattimento, Stoccata, Volontà di ferro","abilita":"Conoscenze +8, Furtività +17, Percezione +12, Raggirare +9, Scalare +8"},{"id":"indigesto","nome":"Indigesto","livello":12,"tipo":"Disarticolato","taglia":"sciame di minuscoli","sciame":true,"focus":false,"nota":"","iniziativa":3,"descr":"Una massa di tessuto semidigesto che striscia come uno sciame vivente. Corrosivo, acido e nauseante, è quasi impossibile da fermare con le armi normali e devasta i maghi in ambienti chiusi.","extra":["Resistenze: Acido 10","Capacità difensive: tratti degli sciami","Spazio 3 m"],"capacita":[{"nome":"Tratti degli sciami","tipo":"Sfo","testo":"Immune a qualsiasi danno da arma singola. Subisce danno dimezzato da armi taglienti e perforanti, danno normale da armi contundenti e +50% da effetti ad area. Immune a [FRASTORNAMENTO] e manovre di combattimento. Non può essere [IN LOTTA]. Occupa uno spazio di 3 m × 3 m."},{"nome":"Distrazione","tipo":"Sop","testo":"Ogni creatura nel proprio spazio al termine del turno deve superare un TS su Tempra con CD 16 o essere [NAUSEATA] per 1 round. CD = 10 + 5 (½×10) + 0 (Car 11)."},{"nome":"Digestione","tipo":"Sop","testo":"Ogni creatura nel proprio spazio deve superare un TS su Riflessi con CD 16 o subire 2d6 danni da acido per 1d4 round. Rimuovere il corrosivo richiede 1 round completo o equivale a un TS superato."}],"ca":21,"contatto":16,"impreparato":21,"pf":75,"dv":10,"ts":{"Tempra":6,"Riflessi":9,"Volontà":11},"velocita":"9 m, Nuotare 6 m, Scalare 6 m","attacchi":["Sciame 3d6"],"att_speciali":"Distrazione CD 16, Digestione CD 16","car":{"For":4,"Des":16,"Cos":nu
